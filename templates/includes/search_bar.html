{% load i18n %}
<div x-data="{ q: '' }" class="relative w-full">

  <!-- Icône loupe -->
  <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5">
    <svg class="h-4 w-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M21 21l-4.35-4.35M17 11A6 6 0 115 11a6 6 0 0112 0z"/>
    </svg>
  </div>

  <!-- Input principal -->
  <input type="text"
         name="q"
         x-ref="input"
         x-model="q"
         autocomplete="off"
         placeholder="{{ placeholder|default:'Rechercher...' }}"
         hx-get="{{ url }}"
         hx-trigger="keyup changed delay:300ms"
         hx-target="#{{ target }}"
         hx-swap="innerHTML"
         hx-indicator="#search-spinner-{{ target }}"
         class="w-full min-h-[44px] rounded-lg border border-gray-200 bg-gray-50 py-2.5 pl-10 pr-10
                text-sm text-gray-900 placeholder-gray-400
                transition focus:border-[#1E3A5F] focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#1E3A5F]/20">

  <!-- Spinner HTMX (masqué par défaut, visible pendant la requête) -->
  <div id="search-spinner-{{ target }}"
       class="htmx-indicator pointer-events-none absolute inset-y-0 right-9 flex items-center">
    <svg class="h-4 w-4 animate-spin text-gray-400" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
      <path class="opacity-75" fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
    </svg>
  </div>

  <!-- Bouton clear (visible si texte saisi) -->
  <button x-show="q.length > 0"
          x-cloak
          type="button"
          hx-get="{{ url }}"
          hx-vals='{"q": ""}'
          hx-target="#{{ target }}"
          hx-swap="innerHTML"
          @click="q = ''"
          class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400
                 hover:text-gray-600 transition"
          :title="'{% trans "Effacer la recherche" %}'">
    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
            d="M6 18L18 6M6 6l12 12"/>
    </svg>
  </button>

</div>

{% extends "base.html" %}

{% block title %}403 — Accès refusé{% endblock %}

{% block content %}
<div class="flex flex-col items-center justify-center text-center px-6 py-20 min-h-[60vh]">
  <p class="text-7xl sm:text-9xl font-black text-primary-600 leading-none tracking-tight">403</p>
  <h1 class="mt-6 text-2xl font-bold text-gray-900">Accès refusé</h1>
  <p class="mt-3 max-w-md text-gray-500 leading-relaxed">
    Tu n'as pas la permission d'accéder à cette page.
    Connecte-toi avec un compte autorisé.
  </p>
  <div class="mt-8 flex flex-col sm:flex-row gap-3">
    <a href="/"
       class="px-6 py-3 rounded-xl bg-primary-600 text-white font-semibold text-sm
              hover:bg-primary-700 active:scale-95 transition text-center">
      Retour à l'accueil
    </a>
    <a href="{% url 'accounts:login' %}"
       class="px-6 py-3 rounded-xl border border-gray-200 text-gray-700 font-semibold text-sm
              hover:bg-gray-50 active:scale-95 transition text-center">
      Se connecter
    </a>
  </div>
</div>
{% endblock %}

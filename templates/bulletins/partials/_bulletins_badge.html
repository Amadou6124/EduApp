{% comment %}Badge compteur X/Y de l'onglet Bulletins. oob=True → mise à jour OOB après génération.{% endcomment %}
<span id="bulletins-count-badge"{% if oob %} hx-swap-oob="true"{% endif %}
      class="ml-0.5 px-1.5 py-0.5 rounded-full text-xs font-mono {% if total_count and generated_count == total_count %}bg-green-100 text-green-700{% else %}bg-gray-200 text-gray-600{% endif %}">{{ generated_count|default:'0' }}/{{ total_count }}</span>

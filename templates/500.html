<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Erreur serveur — EduApp</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #111827;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .box { text-align: center; max-width: 460px; }
    .code {
      font-size: 96px;
      font-weight: 800;
      color: #4F46E5;
      line-height: 1;
      letter-spacing: -2px;
    }
    h1 {
      margin-top: 20px;
      font-size: 24px;
      font-weight: 700;
      color: #111827;
    }
    p {
      margin-top: 12px;
      font-size: 15px;
      line-height: 1.6;
      color: #6B7280;
    }
    .btn {
      display: inline-block;
      margin-top: 28px;
      padding: 13px 26px;
      background: #4F46E5;
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      border-radius: 12px;
      transition: background 0.15s;
    }
    .btn:hover { background: #4338CA; }
  </style>
</head>
<body>
  <div class="box">
    <div class="code">500</div>
    <h1>Erreur serveur</h1>
    <p>
      Une erreur inattendue s'est produite.
      Notre équipe a été notifiée.
      Réessaie dans quelques instants.
    </p>
    <a href="/" class="btn">Retour à l'accueil</a>
  </div>
</body>
</html>

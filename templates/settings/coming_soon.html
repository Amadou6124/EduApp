{% extends "settings/settings_base.html" %}

{% block settings_content %}
<div class="max-w-2xl mx-auto px-8 py-12">

  {# Icône grande + badge #}
  <div class="flex flex-col items-center text-center py-16">
    <div class="w-20 h-20 rounded-2xl bg-gray-100 flex items-center justify-center mb-6">
      <svg class="w-9 h-9 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        {% if section_icon == "calendar" %}
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
        {% elif section_icon == "credit-card" %}
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/>
        {% elif section_icon == "document" %}
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/>
        {% elif section_icon == "template" %}
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h2a1 1 0 011 1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-6z"/>
        {% elif section_icon == "chat" %}
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
        {% elif section_icon == "phone" %}
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
        {% elif section_icon == "user" %}
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
        {% elif section_icon == "lock" %}
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
        {% elif section_icon == "chart" %}
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
        {% else %}
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
        {% endif %}
      </svg>
    </div>

    <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-brand-blue/8 text-brand-blue text-xs font-semibold mb-4 border border-brand-blue/15">
      <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      Disponible prochainement
    </span>

    <h2 class="text-2xl font-bold text-gray-900 mb-3">{{ section_title }}</h2>
    <p class="text-gray-500 text-sm leading-relaxed max-w-sm">{{ section_desc }}</p>

    <div class="mt-10 w-full max-w-xs bg-gray-50 rounded-2xl border border-gray-200 p-5">
      <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-3">En cours de développement</p>
      <div class="space-y-2.5">
        <div class="flex items-center gap-3">
          <div class="w-2 h-2 rounded-full bg-brand-gold flex-shrink-0"></div>
          <div class="h-2 bg-gray-200 rounded-full flex-1"></div>
        </div>
        <div class="flex items-center gap-3">
          <div class="w-2 h-2 rounded-full bg-gray-300 flex-shrink-0"></div>
          <div class="h-2 bg-gray-100 rounded-full w-3/4"></div>
        </div>
        <div class="flex items-center gap-3">
          <div class="w-2 h-2 rounded-full bg-gray-200 flex-shrink-0"></div>
          <div class="h-2 bg-gray-100 rounded-full w-1/2"></div>
        </div>
      </div>
    </div>
  </div>

</div>
{% endblock %}

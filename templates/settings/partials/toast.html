{% comment %}
Toast notification — haut droite.
Usage : déclencher via HTMX response header HX-Trigger: {"showToast": {"message": "...", "type": "success"}}
Ou via Alpine event : $dispatch('show-toast', { message: '...', type: 'success' })
{% endcomment %}
<div id="toast-container"
     class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"
     x-data="{
       toasts: [],
       add(msg, type, receiptUrl) {
         const id = Date.now();
         this.toasts.push({ id, message: msg, type: type || 'success', receiptUrl: receiptUrl || null });
         setTimeout(() => this.remove(id), 5000);
       },
       remove(id) {
         this.toasts = this.toasts.filter(t => t.id !== id);
       }
     }"
     @show-toast.window="add($event.detail.message, $event.detail.type, $event.detail.receipt_url)">

  <template x-for="toast in toasts" :key="toast.id">
    <div x-show="true"
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 translate-x-8"
         x-transition:enter-end="opacity-100 translate-x-0"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100 translate-x-0"
         x-transition:leave-end="opacity-0 translate-x-8"
         class="pointer-events-auto flex items-start gap-3 px-4 py-3 rounded-xl shadow-lg border text-sm font-medium min-w-[280px] max-w-sm"
         :class="{
           'bg-green-50 border-green-200 text-green-800': toast.type === 'success',
           'bg-red-50   border-red-200   text-red-800':   toast.type === 'error',
           'bg-blue-50  border-blue-200  text-blue-800':  toast.type === 'info',
         }">
      <span class="mt-0.5 flex-shrink-0">
        <template x-if="toast.type === 'success'">
          <svg class="w-4 h-4 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
          </svg>
        </template>
        <template x-if="toast.type === 'error'">
          <svg class="w-4 h-4 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </template>
        <template x-if="toast.type === 'info'">
          <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
        </template>
      </span>
      <span class="flex-1 leading-snug">
        <span x-text="toast.message"></span>
        <template x-if="toast.receiptUrl">
          <a :href="toast.receiptUrl" target="_blank"
             class="block mt-1 text-xs underline opacity-70 hover:opacity-100">
            Télécharger le reçu
          </a>
        </template>
      </span>
      <button @click="remove(toast.id)" class="text-current opacity-40 hover:opacity-70 transition ml-1 flex-shrink-0">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
  </template>

</div>

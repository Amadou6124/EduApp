{% load i18n %}
<div class="flex items-center justify-between px-5 py-4 bg-white border border-gray-200 rounded-xl hover:border-gray-300 transition"
     id="period-{{ period.id }}" x-data="{ edit: false }">

  <!-- Ordre + Nom + dates -->
  <div class="flex items-center gap-4 min-w-0">
    <span class="flex-shrink-0 w-7 h-7 flex items-center justify-center rounded-full bg-gray-100 text-xs font-bold text-gray-500">
      {{ period.order }}
    </span>
    <div class="min-w-0">
      <p class="font-semibold text-gray-900 text-sm">{{ period.name }}</p>
      <p class="text-xs text-gray-500 mt-0.5">
        {{ period.start_date|date:"d/m/Y" }} → {{ period.end_date|date:"d/m/Y" }}
        <span class="ml-2 text-gray-400">{{ period.get_period_type_display }}</span>
      </p>
    </div>
  </div>

  <!-- Statut saisie + actions -->
  <div class="flex items-center gap-3 flex-shrink-0">
    <!-- Toggle saisie notes -->
    <form hx-post="{% url 'settings:period-toggle-notes' period.id %}"
          hx-target="#period-{{ period.id }}"
          hx-swap="outerHTML">
      {% csrf_token %}
      {% if period.is_notes_open %}
      <button type="submit"
              class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold bg-green-50 text-green-700 border border-green-200 rounded-lg hover:bg-green-100 transition">
        <span class="w-1.5 h-1.5 rounded-full bg-green-500 flex-shrink-0"></span>
        Ouverte — Fermer
      </button>
      {% else %}
      <button type="submit"
              class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold bg-gray-50 text-gray-500 border border-gray-200 rounded-lg hover:bg-gray-100 transition">
        <span class="w-1.5 h-1.5 rounded-full bg-gray-400 flex-shrink-0"></span>
        Fermée — Ouvrir
      </button>
      {% endif %}
    </form>

    <!-- Modifier -->
    <button type="button" @click="edit = true"
            class="p-1.5 text-gray-400 hover:text-primary-600 hover:bg-primary-50 rounded-lg transition">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
      </svg>
    </button>

    <!-- Supprimer -->
    <button type="button"
            @click="$store.confirm.show({
              title: 'Supprimer {{ period.name }}',
              message: 'Cette période sera supprimée définitivement.',
              warning: 'Si des notes existent sur cette période, la suppression sera bloquée.',
              confirmText: 'Supprimer', confirmIcon: 'trash-2', confirmClass: 'btn-danger',
              icon: 'alert-triangle', iconBg: 'bg-red-50', iconColor: 'text-red-500',
              onConfirm: () => htmx.ajax('DELETE', '{% url "settings:period-delete" period.id %}', {target: '#periods-list', swap: 'innerHTML'})
            })"
            class="p-1.5 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
      </svg>
    </button>
  </div>

  <!-- Modal édition période -->
  <div x-show="edit" x-cloak
       @click.self="edit = false" @keydown.escape.window="edit = false"
       class="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 text-left">
    <form hx-post="{% url 'settings:period-update' period.id %}"
          hx-target="#periods-list" hx-swap="innerHTML"
          @click.stop
          class="bg-white rounded-2xl shadow-2xl border border-gray-100 w-full max-w-md p-5 space-y-3">
      {% csrf_token %}
      <h4 class="text-sm font-semibold text-gray-900">Modifier la période</h4>
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Nom <span class="text-red-500">*</span></label>
        <input name="name" value="{{ period.name }}" required maxlength="100"
               class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500">
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Type</label>
          <select name="period_type"
                  class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-primary-500">
            <option value="trimester" {% if period.period_type == 'trimester' %}selected{% endif %}>Trimestre</option>
            <option value="semester"  {% if period.period_type == 'semester' %}selected{% endif %}>Semestre</option>
            <option value="custom"    {% if period.period_type == 'custom' %}selected{% endif %}>Personnalisé</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Ordre</label>
          <input name="order" type="number" min="1" value="{{ period.order }}"
                 class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500">
        </div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Début</label>
          <input name="start_date" type="date" value="{{ period.start_date|date:'Y-m-d' }}"
                 class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Fin</label>
          <input name="end_date" type="date" value="{{ period.end_date|date:'Y-m-d' }}"
                 class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500">
        </div>
      </div>
      <div class="flex gap-2 pt-1">
        <button type="submit"
                class="flex-1 bg-primary-600 text-white text-xs font-semibold rounded-lg py-2.5 hover:bg-primary-700 transition">Enregistrer</button>
        <button type="button" @click="edit = false"
                class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-semibold rounded-lg py-2.5 transition">Annuler</button>
      </div>
    </form>
  </div>
</div>

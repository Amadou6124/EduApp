{% load i18n %}
{% if subjects %}
  <div class="flex flex-wrap gap-2 max-h-40 overflow-y-auto">
    {% for subject in subjects %}
    <div x-data="{ edit: false }"
         x-show="cq === '' || '{{ subject.name|lower|escapejs }} {{ subject.short_name|lower|escapejs }}'.includes(cq.toLowerCase().trim())"
         class="group inline-flex items-center gap-2 border border-gray-200 rounded-full pl-2.5 pr-1 py-1 hover:border-gray-300 transition">
      <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background-color: {{ subject.color }};"></span>
      <span class="text-sm text-gray-800">{{ subject.name }}</span>
      <span class="text-[11px] font-mono font-medium text-gray-600">{{ subject.short_name }}</span>
      <span class="flex items-center opacity-0 group-hover:opacity-100 transition-opacity">
        <button type="button" @click="edit = true" class="p-1 text-gray-300 hover:text-primary-600 rounded-full" title="Modifier">
          <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
        </button>
        <button type="button"
                @click="$store.confirm.show({
                  title: 'Supprimer {{ subject.name|escapejs }}',
                  message: 'Cette matière sera désactivée dans toute l\'école.',
                  confirmText: 'Supprimer', confirmIcon: 'trash-2', confirmClass: 'btn-danger',
                  icon: 'alert-triangle', iconBg: 'bg-red-50', iconColor: 'text-red-500',
                  onConfirm: () => htmx.ajax('DELETE', '{% url 'settings:subject-delete' subject.id %}', {target: '#subject-list', swap: 'innerHTML'})
                })"
                class="p-1 text-gray-300 hover:text-red-500 rounded-full" title="Supprimer">
          <i data-lucide="x" class="w-3.5 h-3.5"></i>
        </button>
      </span>

      {# Modal édition #}
      <template x-teleport="body">
        <div x-show="edit" x-cloak @keydown.escape.window="edit = false"
             class="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4" @click.self="edit = false">
          <form hx-post="{% url 'settings:subject-update' subject.id %}"
                hx-target="#subject-list" hx-swap="innerHTML" @click.stop
                class="bg-white rounded-2xl shadow-2xl border border-gray-100 w-full max-w-sm p-5 space-y-3 text-left">
            {% csrf_token %}
            <h4 class="text-sm font-semibold text-gray-900">Modifier la matière</h4>
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">Nom <span class="text-red-400">*</span></label>
              <input name="name" value="{{ subject.name }}" required maxlength="100" class="input-field w-full text-sm">
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1">Abréviation <span class="text-gray-400 font-normal">auto si vide</span></label>
              <input name="short_name" value="{{ subject.short_name }}" maxlength="10" class="input-field w-full text-sm">
            </div>
            <div class="flex gap-2 pt-1">
              <button type="submit" class="btn-primary flex-1 justify-center text-sm">Enregistrer</button>
              <button type="button" @click="edit = false" class="btn-secondary flex-1 justify-center text-sm">Annuler</button>
            </div>
          </form>
        </div>
      </template>
    </div>
    {% endfor %}
  </div>
{% else %}
  <p class="text-sm text-gray-400 py-4">Aucune matière — ajoutez-en une (bouton « Matière ») ou via les suggestions.</p>
{% endif %}

{% load i18n %}
{% if subjects %}
  <div class="space-y-2">
    {% for subject in subjects %}
    <div class="flex items-center justify-between px-4 py-3 bg-white border border-gray-200 rounded-xl hover:border-gray-300 transition">
      <div class="flex items-center gap-3 min-w-0">
        <!-- Badge coloré -->
        <span class="flex-shrink-0 w-8 h-8 rounded-lg flex items-center justify-center text-xs font-bold text-white"
              style="background-color: {{ subject.color }};">
          {{ subject.short_name|truncatechars:3 }}
        </span>
        <div class="min-w-0">
          <p class="text-sm font-semibold text-gray-900 truncate">{{ subject.name }}</p>
          <p class="text-xs text-gray-400">{{ subject.short_name }}</p>
        </div>
      </div>
      <!-- Supprimer (soft delete) -->
      <button type="button"
              @click="$store.confirm.show({
                title: 'Supprimer {{ subject.name }}',
                message: 'Cette matière sera désactivée dans toute l\'école.',
                confirmText: 'Supprimer', confirmIcon: 'trash-2', confirmClass: 'btn-danger',
                icon: 'alert-triangle', iconBg: 'bg-red-50', iconColor: 'text-red-500',
                onConfirm: () => htmx.ajax('DELETE', '{% url "settings:subject-delete" subject.id %}', {target: '#subject-list', swap: 'innerHTML'})
              })"
              class="p-1.5 text-gray-300 hover:text-red-500 hover:bg-red-50 rounded-lg transition flex-shrink-0">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
        </svg>
      </button>
    </div>
    {% endfor %}
  </div>
{% else %}
  <div class="text-center py-10 text-gray-400">
    <p class="text-sm">Aucune matière configurée.</p>
    <p class="text-xs mt-1">Ajoutez-en une ou utilisez les suggestions.</p>
  </div>
{% endif %}

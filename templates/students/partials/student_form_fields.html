{% load i18n %}
{% for field in form.visible_fields %}
  {% if field.name not in "initial_payment,payment_method" %}
    <div class="mb-4 {% if field.name == 'parent_phone_number' or field.name == 'parent_relationship' %}parent-field{% endif %}
                     {% if field.name == 'initial_payment' or field.name == 'payment_method' %}payment-field{% endif %}">
      <label class="block text-sm font-medium text-gray-700 mb-1.5">
        {{ field.label }}{% if field.field.required %} <span class="text-red-500">*</span>{% endif %}
      </label>
      {% if field.errors %}
        {{ field.as_widget }}
        {% for error in field.errors %}
          <p class="mt-1 text-xs text-red-600">{{ error }}</p>
        {% endfor %}
      {% else %}
        {{ field.as_widget }}
      {% endif %}
    </div>
  {% endif %}
{% endfor %}

{% load humanize %}
<div id="student-stats" class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">

  <div class="card p-5">
    <p class="text-xs text-gray-500 uppercase tracking-wide mb-1">Total élèves</p>
    <p class="text-2xl font-bold text-primary-700">{{ stats.total }}</p>
  </div>

  <div class="card p-5">
    <p class="text-xs text-gray-500 uppercase tracking-wide mb-1">Inscrits aujourd'hui</p>
    <p class="text-2xl font-bold text-green-600">{{ stats.enrolled_today }}</p>
  </div>

  <div class="card p-5">
    <p class="text-xs text-gray-500 uppercase tracking-wide mb-1">Sans parent lié</p>
    <p class="text-2xl font-bold text-orange-500">{{ stats.without_parent }}</p>
  </div>

  <div class="card p-5">
    <p class="text-xs text-gray-500 uppercase tracking-wide mb-1">Solde impayé global</p>
    <p class="text-2xl font-bold text-red-600">{{ stats.unpaid_balance|intcomma }} <span class="text-sm font-normal text-gray-400">FCFA</span></p>
  </div>

</div>

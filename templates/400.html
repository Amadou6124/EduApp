{% extends "base.html" %}

{% block title %}400 — Requête incorrecte{% endblock %}

{% block content %}
<div class="flex flex-col items-center justify-center text-center px-6 py-20 min-h-[60vh]">
  <p class="text-7xl sm:text-9xl font-black text-indigo-600 leading-none tracking-tight">400</p>
  <h1 class="mt-6 text-2xl font-bold text-gray-900">Requête incorrecte</h1>
  <p class="mt-3 max-w-md text-gray-500 leading-relaxed">
    Une erreur s'est produite avec ta demande.
    Réessaie ou retourne à l'accueil.
  </p>
  <div class="mt-8 flex flex-col sm:flex-row gap-3">
    <a href="/"
       class="px-6 py-3 rounded-xl bg-indigo-600 text-white font-semibold text-sm
              hover:bg-indigo-700 active:scale-95 transition text-center">
      Retour à l'accueil
    </a>
    <a href="javascript:history.back()"
       class="px-6 py-3 rounded-xl border border-gray-200 text-gray-700 font-semibold text-sm
              hover:bg-gray-50 active:scale-95 transition text-center">
      Réessayer
    </a>
  </div>
</div>
{% endblock %}

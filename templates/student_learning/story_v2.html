{% load static %}<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <title>{{ scene.name }} — Histoire</title>

  {# Thème AVANT peinture (évite le flash) : choix mémorisé, sinon clair. #}
  <script>(function(){try{document.documentElement.dataset.theme=localStorage.getItem('learn-theme')||'light';}catch(e){}})();</script>

  <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'vendor/fonts/nunito/nunito.css' %}">
  <script defer src="{% static 'vendor/lucide/lucide.min.js' %}"></script>
  <script defer src="{% static 'vendor/alpine/alpine.min.js' %}"></script>

  {{ characters|json_script:"s-chars-json" }}
  {{ steps|json_script:"s-steps-json" }}
  {{ scene|json_script:"s-scene-json" }}
  <script>
    const STORY_CFG = { finishUrl:"{{ finish_url|default:'' }}", parcoursUrl:"{{ parcours_url }}", csrf:"{{ csrf_token }}" };
  </script>

  <style>
    *,*::before,*::after{box-sizing:border-box}
    html,body{margin:0;height:100%;overflow:hidden}
    button,input{font-family:inherit}
    ::-webkit-scrollbar{width:0}
    body{font-family:var(--font-ui);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
    [x-cloak]{display:none!important}

    .st-root{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
    .st-aube{position:absolute;left:0;right:0;top:0;height:46%;z-index:0;pointer-events:none;transition:background 1s ease}

    /* TOP : X · barre à points · sons */
    .st-top{position:relative;z-index:6;display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 14px 8px}
    .st-cc{width:36px;height:36px;flex:0 0 36px;border-radius:50%;border:none;background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow-sm);transition:transform .12s}
    .st-cc:active{transform:scale(.9)} .st-cc.on{color:var(--accent)}
    .st-bar{flex:1;height:12px;border-radius:12px;background:var(--node-ring-track);position:relative}
    .st-fill{position:absolute;left:0;top:0;bottom:0;border-radius:12px;background:var(--accent);transition:width .5s cubic-bezier(.3,.9,.3,1)}
    .st-node{position:absolute;top:50%;width:8px;height:8px;border-radius:50%;transform:translate(-50%,-50%);background:var(--surface);box-shadow:0 0 0 1.5px rgba(0,0,0,.10);transition:all .35s}
    .st-node.now{width:16px;height:16px;animation:st-np 1.8s infinite}

    /* FEED */
    .st-feed{position:relative;z-index:2;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:11px;padding:12px 14px 18px}
    .st-narr{align-self:center;text-align:center;font-size:13px;font-weight:700;font-style:italic;color:var(--ink-muted);max-width:86%;line-height:1.45;margin:6px 0;animation:st-in .3s ease}
    .st-msg{display:flex;flex-direction:column;max-width:84%;animation:st-in .3s ease}
    .st-msg.left{align-self:flex-start} .st-msg.right{align-self:flex-end}
    .st-who{font-size:10.5px;font-weight:900;letter-spacing:.03em;display:flex;align-items:center;gap:5px;margin:0 0 3px 5px}
    .st-bub{padding:10px 13px;font-size:14.5px;line-height:1.45;font-weight:600;color:var(--ink);border-radius:17px;position:relative}
    .st-npc{background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:5px;box-shadow:0 1px 5px rgba(60,40,30,.06)}
    .st-me{background:var(--info-soft);border-bottom-right-radius:5px}
    .st-speak{position:absolute;right:-30px;bottom:2px;background:none;border:none;color:var(--ink-faint);cursor:pointer;padding:4px}
    .st-typing{align-self:flex-start;background:var(--surface);border:1px solid var(--border);border-radius:17px;border-bottom-left-radius:5px;padding:12px 15px;display:flex;gap:5px;animation:st-in .3s ease}
    .st-typing i{width:7px;height:7px;border-radius:50%;background:var(--ink-faint);display:block;animation:st-blink 1.3s infinite}
    .st-typing i:nth-child(2){animation-delay:.2s} .st-typing i:nth-child(3){animation-delay:.4s}

    /* COMPOSE / INTERACTION (bas) */
    .st-compose{position:relative;z-index:6;flex-shrink:0;background:var(--surface);border-top:1px solid var(--border);padding:12px 14px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(60,40,30,.06);animation:st-up .3s cubic-bezier(.2,.9,.3,1)}
    .st-clab{font-size:10px;font-weight:900;letter-spacing:.1em;color:var(--ink-faint);text-align:center;margin-bottom:9px}
    .st-chip{display:flex;align-items:center;gap:9px;width:100%;min-height:50px;background:var(--bg);border:1.5px solid var(--info-soft);border-radius:15px;padding:0 14px;color:var(--ink);font-weight:800;font-size:14.5px;margin-bottom:9px;box-shadow:0 3px 0 var(--track);cursor:pointer;text-align:left;transition:transform .1s}
    .st-chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--track)}
    .st-chip .snd{margin-left:auto;color:var(--accent)}
    .st-inrow{display:flex;gap:9px;align-items:center}
    .st-input{flex:1;height:50px;border:1.5px solid var(--info-soft);border-radius:25px;background:var(--bg);padding:0 16px;font-size:15px;font-weight:700;color:var(--ink);outline:none;transition:border-color .2s,box-shadow .2s}
    .st-input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
    .st-input.ko{border-color:var(--danger)}
    .st-send{width:50px;height:50px;flex:0 0 50px;border:none;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 3px 0 var(--accent-strong)}
    .st-send:disabled{opacity:.4}
    .st-err{font-size:13px;font-weight:800;color:var(--danger-ink);text-align:center;margin-top:9px}
    .st-give{background:none;border:none;color:var(--ink-faint);font-weight:800;font-size:13px;cursor:pointer;display:block;margin:9px auto 0}
    /* tokens (Duolingo) */
    .st-line{min-height:48px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-bottom:2px solid var(--border);padding:6px 2px;margin-bottom:12px}
    .st-line.ko{border-color:var(--danger)}
    .st-bank{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-bottom:12px}
    .st-tok{min-height:44px;padding:0 14px;display:flex;align-items:center;border:1.5px solid var(--border);border-radius:12px;background:var(--surface);color:var(--ink);font-weight:800;font-size:14.5px;cursor:pointer;box-shadow:0 3px 0 var(--track);transition:transform .1s}
    .st-tok:active{transform:translateY(2px);box-shadow:0 1px 0 var(--track)}
    .st-tok.inline{background:var(--accent-soft);border-color:var(--accent)}
    .st-valid{width:100%;height:50px;border:none;border-radius:15px;background:var(--accent);color:var(--accent-ink);font-weight:900;font-size:16px;cursor:pointer;box-shadow:0 4px 0 var(--accent-strong)}
    .st-valid:disabled{opacity:.4}
    /* blank */
    .st-blank{font-size:16px;font-weight:800;color:var(--ink-strong);text-align:center;line-height:1.8;margin-bottom:14px}
    .st-hole{display:inline-block;min-width:60px;border-bottom:3px solid var(--accent);color:var(--accent)}

    /* micro-explosion */
    .st-burst{position:absolute;left:50%;top:40%;z-index:9;pointer-events:none}
    .st-spark{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--success);animation:st-spark .5s ease-out forwards}

    /* RÉCOMPENSE */
    .st-reward{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;background:var(--bg);animation:st-endin .5s cubic-bezier(.2,.9,.3,1)}
    .st-trophy-wrap{position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:18px}
    .st-trophy{width:104px;height:104px;border-radius:32px;display:flex;align-items:center;justify-content:center;background:var(--accent);color:var(--accent-ink);box-shadow:0 14px 34px var(--accent-soft);animation:st-pop .5s cubic-bezier(.2,1.4,.4,1)}
    .st-flash{position:absolute;width:104px;height:104px;border-radius:32px;border:3px solid var(--accent);animation:st-flash .75s .12s ease-out backwards;pointer-events:none}
    .st-stars{display:flex;gap:8px;margin-bottom:14px}
    .st-star{color:var(--track)} .st-star.on{color:var(--xp,#F5A623);animation:st-pop .4s backwards}
    .st-score{font-size:52px;font-weight:900;line-height:1;color:var(--ink-strong)}
    .st-rlabel{font-size:15px;font-weight:800;color:var(--ink-muted);margin:6px 0 26px}
    .st-rbtn{display:inline-flex;align-items:center;gap:8px;height:54px;padding:0 26px;border:none;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-weight:900;font-size:16px;cursor:pointer;box-shadow:0 4px 0 var(--accent-strong);text-decoration:none}
    .st-restart{background:none;border:none;color:var(--ink-faint);font-weight:800;font-size:14px;cursor:pointer;margin-top:16px}
    .st-confetti{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:st-fall linear forwards}

    @keyframes st-in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
    @keyframes st-up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    @keyframes st-blink{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
    @keyframes st-np{0%{box-shadow:0 0 0 1.5px rgba(0,0,0,.10),0 0 0 0 var(--accent-soft)}70%{box-shadow:0 0 0 1.5px rgba(0,0,0,.10),0 0 0 9px transparent}100%{box-shadow:0 0 0 1.5px rgba(0,0,0,.10),0 0 0 0 transparent}}
    @keyframes st-spark{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
    @keyframes st-endin{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
    @keyframes st-pop{0%{transform:scale(0)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
    @keyframes st-flash{0%{transform:scale(.6);opacity:.8}100%{transform:scale(2.2);opacity:0}}
    @keyframes st-fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
  </style>
</head>
<body>
<div class="st-root" x-data="storyPlayer()" x-cloak
     :style="`--accent:${accentReadable};--accent-strong:${accentStrong};--accent-soft:${accentSoftCss};--accent-ink:#fff`">

  <div class="st-aube" :style="`background:linear-gradient(180deg, ${aubeCss} 0%, transparent 100%)`"></div>

  <!-- TOP -->
  <div class="st-top">
    <a class="st-cc" :href="parcoursUrl" @click="stopAll()" aria-label="Quitter"><i data-lucide="x"></i></a>
    <div class="st-bar">
      <div class="st-fill" :style="`width:${fillPct}%`"></div>
      <template x-for="(n,i) in nodes" :key="i"><div class="st-node" :class="i===curNode?'now':''" :style="`left:${n}%`"></div></template>
    </div>
    <button class="st-cc" :class="sfxMuted?'':'on'" @click="sfxMuted=!sfxMuted" aria-label="Sons"><i :data-lucide="sfxMuted?'volume-off':'volume-2'"></i></button>
    <button class="st-cc" :class="ttsOn?'on':''" @click="toggleTts()" aria-label="Voix"><i data-lucide="ear"></i></button>
  </div>

  <!-- FEED -->
  <div class="st-feed" x-ref="feed">
    <template x-for="(m,i) in history" :key="i">
      <div>
        <template x-if="m.kind==='narration'"><div class="st-narr" x-text="m.text"></div></template>
        <template x-if="m.kind==='char'">
          <div class="st-msg left">
            <div class="st-who" :style="`color:${nameColor(m.who)}`"><svg width="11" height="11" viewBox="0 0 12 12"><rect x="6" y="0" width="8.5" height="8.5" transform="rotate(45 6 6)" :fill="nameColor(m.who)"/></svg><span x-text="findChar(m.who).name.toUpperCase()"></span></div>
            <div class="st-bub st-npc"><span x-text="m.text"></span><button class="st-speak" @click="speakNow(m.text)"><i data-lucide="volume-2" style="width:15px;height:15px"></i></button></div>
          </div>
        </template>
        <template x-if="m.kind==='user'"><div class="st-msg right"><div class="st-bub st-me" x-text="m.text"></div></div></template>
      </div>
    </template>
    <template x-if="typing!==null">
      <div class="st-typing"><i></i><i></i><i></i></div>
    </template>
  </div>

  <!-- COMPOSE / INTERACTION -->
  <template x-if="waiting">
    <div class="st-compose">
      <!-- CHOICE : réponses à envoyer -->
      <template x-if="waiting.type==='choice'">
        <div>
          <div class="st-clab">TA RÉPONSE</div>
          <template x-for="(opt,i) in waiting.options" :key="i">
            <button class="st-chip" @click="resolveChoice(opt)"><span x-text="opt.label"></span><i data-lucide="send" class="snd" style="width:16px;height:16px"></i></button>
          </template>
        </div>
      </template>
      <!-- INPUT : composer un message -->
      <template x-if="waiting.type==='input'">
        <div>
          <div class="st-clab">TA RÉPONSE</div>
          <div class="st-inrow">
            <input class="st-input" :class="inputErr?'ko':''" type="text" x-model="inputVal" placeholder="Écris ta réponse…" autocomplete="off" autocorrect="off" spellcheck="false" @keydown.enter="submitInput()">
            <button class="st-send" :disabled="!inputVal.trim()" @click="submitInput()"><i data-lucide="send" style="width:20px;height:20px"></i></button>
          </div>
          <div class="st-err" x-show="inputErr" x-text="inputPunctMsg ? 'Presque ! Pense à la ponctuation finale.' : (waiting.hint || 'Réessaie.')"></div>
          <button class="st-give" x-show="inputTries>=2" @click="revealInput()">Montrer la réponse</button>
        </div>
      </template>
      <!-- TOKENS : ordonner (Duolingo) -->
      <template x-if="waiting.type==='tokens'">
        <div>
          <div class="st-clab">REMETS DANS L'ORDRE</div>
          <div class="st-line" :class="tokensErr?'ko':''">
            <template x-if="tokensOrder.length===0"><span style="color:var(--ink-faint);font-weight:700;font-size:13px">Appuie sur les mots…</span></template>
            <template x-for="t in tokensOrder" :key="t"><button class="st-tok inline" @click="removeToken(t)" x-text="t"></button></template>
          </div>
          <div class="st-bank"><template x-for="t in tokensBank" :key="t"><button class="st-tok" @click="addToken(t)" x-text="t"></button></template></div>
          <button class="st-valid" :disabled="tokensOrder.length < waiting.tokens.length" @click="checkTokens()">Envoyer</button>
          <button class="st-give" x-show="tokensTries>=2" @click="revealTokens()">Montrer l'ordre</button>
        </div>
      </template>
      <!-- BLANK : compléter -->
      <template x-if="waiting.type==='blank'">
        <div>
          <div class="st-blank"><span x-text="waiting.parts[0]"></span><span class="st-hole" x-text="blankPick || '____'"></span><span x-text="waiting.parts[1]"></span></div>
          <template x-for="(opt,i) in waiting.options" :key="i">
            <button class="st-chip" :class="blankErr&&blankPick===opt ? 'ko':''" @click="submitBlank(opt)"><span x-text="opt"></span></button>
          </template>
          <div class="st-err" x-show="blankErr" x-text="blankPunctMsg ? 'Presque ! Pense à la ponctuation.' : 'Pas tout à fait, réessaie.'"></div>
        </div>
      </template>
    </div>
  </template>

  <!-- micro-explosion -->
  <div class="st-burst" x-show="burst" x-cloak><template x-for="s in sparks" :key="s.id"><div class="st-spark" :style="`--dx:${s.dx}px;--dy:${s.dy}px`"></div></template></div>

  <!-- RÉCOMPENSE -->
  <template x-if="done">
    <div class="st-reward">
      <template x-for="c in confetti" :key="c.id"><div class="st-confetti" :style="`left:${c.l}%;background:${c.color};animation-duration:${c.dur}s;animation-delay:${c.delay}s`"></div></template>
      <div class="st-trophy-wrap"><div class="st-flash"></div><div class="st-trophy"><i data-lucide="party-popper" style="width:46px;height:46px"></i></div></div>
      <div class="st-stars"><template x-for="i in 3" :key="i"><i data-lucide="star" class="st-star" :class="i<=stars?'on':''" :style="`animation-delay:${i*0.12}s;width:30px;height:30px`" :fill="i<=stars?'currentColor':'none'"></i></template></div>
      <div class="st-score" x-text="displayScore + '%'"></div>
      <div class="st-rlabel" x-text="stars===3?'Histoire parfaite !':stars===2?'Bien joué !':'Histoire terminée'"></div>
      <a class="st-rbtn" :href="parcoursUrl" @click="stopAll()">Retour au parcours <i data-lucide="arrow-right" style="width:19px;height:19px"></i></a>
      <button class="st-restart" @click="restart()">Rejouer l'histoire</button>
    </div>
  </template>
</div>

{% verbatim %}
<script>
function _hsl(hex){hex=(hex||'#888').replace('#','');if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');var r=parseInt(hex.slice(0,2),16)/255,g=parseInt(hex.slice(2,4),16)/255,b=parseInt(hex.slice(4,6),16)/255;var mx=Math.max(r,g,b),mn=Math.min(r,g,b),h=0,s=0,l=(mx+mn)/2;if(mx!==mn){var d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h/=6;}return{h:h*360,s:s*100,l:l*100};}
function _clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function _css(h,s,l,a){return a==null?('hsl('+h.toFixed(0)+','+s.toFixed(0)+'%,'+l.toFixed(0)+'%)'):('hsla('+h.toFixed(0)+','+s.toFixed(0)+'%,'+l.toFixed(0)+'%,'+a+')');}
function _norm(s,keepPunct){var out=(s==null?'':s).toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');if(!keepPunct)out=out.replace(/[.!?;:,]/g,' ');return out.replace(/\s+/g,' ').trim();}
function _hasFinalPunct(s){return /[.!?]\s*$/.test((s==null?'':s).toString().trim());}

document.addEventListener('alpine:init', function(){
  Alpine.data('storyPlayer', function(){ return {
    chars: JSON.parse(document.getElementById('s-chars-json').textContent),
    steps: JSON.parse(document.getElementById('s-steps-json').textContent),
    sceneData: JSON.parse(document.getElementById('s-scene-json').textContent),

    step:0, history:[], typing:null, waiting:null, done:false, correct:0, finished:false,
    ttsOn:false, sfxMuted:false, burst:false, sparks:[], confetti:[], displayScore:0,
    inputVal:'', inputErr:false, inputTries:0, inputPunctMsg:false,
    tokensOrder:[], tokensBank:[], tokensErr:false, tokensTries:0,
    blankPick:null, blankErr:false, blankPunctMsg:false,
    finishUrl:STORY_CFG.finishUrl, parcoursUrl:STORY_CFG.parcoursUrl, _ac:null,

    /* couleurs normalisées */
    get _dark(){ return document.documentElement.dataset.theme==='dark'; },
    get _acc(){ var c=(this.chars[0]&&this.chars[0].color)||'#F97316'; return _hsl(c); },
    get accentReadable(){ var c=this._acc; return _css(c.h,_clamp(c.s,30,66), this._dark?66:44); },
    get accentStrong(){ var c=this._acc; return _css(c.h,_clamp(c.s,30,66), this._dark?54:36); },
    get accentSoftCss(){ var c=this._acc; return _css(c.h,_clamp(c.s,25,55), this._dark?30:90, this._dark?.5:1); },
    get aubeCss(){ var c=_hsl(this.sceneData.c1||'#F97316'); return _css(c.h,_clamp(c.s,22,50), this._dark?24:90, this._dark?.5:.85); },
    nameColor(who){ var ch=this.findChar(who); var c=_hsl((ch&&ch.color)||'#F97316'); return _css(c.h,_clamp(c.s,32,70), this._dark?68:38); },

    /* dérivés */
    get interactions(){ return this.steps.filter(function(s){return ['choice','input','tokens','blank'].indexOf(s.type)>=0;}).length; },
    get score(){ return this.interactions ? Math.round(this.correct/this.interactions*100) : 100; },
    get stars(){ return this.score>=80?3:this.score>=50?2:1; },
    get fillPct(){ return this.steps.length ? Math.min(100, this.step/this.steps.length*100) : 0; },
    get lastSpeaker(){ for(var i=this.history.length-1;i>=0;i--){ if(this.history[i].kind==='char') return this.history[i].who; } return null; },
    _beats(){ var idx=[0]; this.steps.forEach(function(s,i){ if(s.type==='narration'&&i>0) idx.push(i); }); idx.push(this.steps.length); return idx; },
    get nodes(){ var L=this.steps.length||1; return this._beats().map(function(i){ return Math.round(i/L*100); }); },
    get curNode(){ var b=this._beats(),n=0; for(var k=0;k<b.length;k++){ if(this.step>=b[k]) n=k; } return n; },

    findChar(id){ return this.chars.find(function(c){return c.id===id;}) || this.chars[0] || {name:'',color:'#888'}; },
    sideOf(id){ var c=this.findChar(id); return (c&&c.side==='left')?'left':'right'; },

    init(){ var self=this; this.$watch('done', function(v){ if(v) self.onDone(); }); this.$nextTick(function(){ if(window.lucide)lucide.createIcons(); self.advance(); }); },
    refreshIcons(){ this.$nextTick(function(){ if(window.lucide)lucide.createIcons(); }); },
    scrollBottom(){ var self=this; this.$nextTick(function(){ var el=self.$refs.feed; if(el) el.scrollTop=el.scrollHeight; }); },
    push(m){ this.history=this.history.concat([m]); this.scrollBottom(); },

    /* auto-play : narration/dialogue défilent, stop aux interactions */
    advance(){
      if(this.step>=this.steps.length){ this.done=true; return; }
      var s=this.steps[this.step], self=this;
      if(s.type==='narration'){
        setTimeout(function(){ self.push({kind:'narration',text:s.text}); self.step++; self.$nextTick(function(){ self.advance(); }); }, 620);
      } else if(s.type==='npc'){
        this.typing=s.who;
        var d=Math.min(480+s.text.length*13, 1700);
        setTimeout(function(){ self.typing=null; self.push({kind:'char',who:s.who,text:s.text}); self.speak(s.text); self.step++; self.$nextTick(function(){ self.refreshIcons(); self.advance(); }); }, d);
      } else {
        var asker=this.lastSpeaker || (this.chars[0]&&this.chars[0].id);
        if(s.prompt) this.push({kind:'char',who:asker,text:s.prompt});
        this.startInteraction(s);
        this.refreshIcons();
      }
    },
    startInteraction(s){
      this.waiting=s;
      if(s.type==='input'){ this.inputVal=''; this.inputErr=false; this.inputTries=0; this.inputPunctMsg=false; }
      else if(s.type==='tokens'){ this.tokensBank=s.tokens.slice(); this.tokensOrder=[]; this.tokensErr=false; this.tokensTries=0; }
      else if(s.type==='blank'){ this.blankPick=null; this.blankErr=false; this.blankPunctMsg=false; }
      this.scrollBottom();
    },
    resolve(userText, reply, replyWho, ok){
      this.waiting=null;
      this.push({kind:'user',text:userText});
      this.sfx('tap');
      if(ok){ this.correct++; this.doBurst(); this.sfx('success'); } else { this.sfx('wrong'); }
      this.step++;
      var self=this;
      if(reply){
        var who=replyWho||(this.chars[0]&&this.chars[0].id);
        this.typing=who;
        var d=Math.min(360+reply.length*11, 1500);
        setTimeout(function(){ self.typing=null; self.push({kind:'char',who:who,text:reply}); self.speak(reply); self.$nextTick(function(){ self.refreshIcons(); self.advance(); }); }, d);
      } else { this.$nextTick(function(){ self.advance(); }); }
    },

    /* ── éval PRÉSERVÉE ── */
    resolveChoice(opt){ var who=this.chars[0]?this.chars[0].id:null; this.resolve(opt.label, opt.reply||null, who, !!opt.correct); },
    submitInput(){
      if(!this.inputVal.trim()) return;
      var self=this, wordsOk=this.waiting.answers.some(function(a){return _norm(a)===_norm(self.inputVal);});
      if(!wordsOk){ this.inputErr=true; this.inputPunctMsg=false; this.inputTries++; this.sfx('wrong'); return; }
      if(this.waiting.check_punctuation && !_hasFinalPunct(this.inputVal)){ this.inputErr=true; this.inputPunctMsg=true; this.inputTries++; this.sfx('wrong'); return; }
      this.inputPunctMsg=false;
      this.resolve(this.inputVal, this.waiting.ok, this.chars[0].id, true);
    },
    revealInput(){ var ans=this.waiting.answers[0].toUpperCase(); this.resolve(ans, 'La réponse était : '+ans+'.', this.chars[0].id, false); },
    addToken(t){ this.tokensBank=this.tokensBank.filter(function(x){return x!==t;}); this.tokensOrder=this.tokensOrder.concat([t]); this.tokensErr=false; this.sfx('tap'); },
    removeToken(t){ this.tokensOrder=this.tokensOrder.filter(function(x){return x!==t;}); this.tokensBank=this.tokensBank.concat([t]); this.tokensErr=false; },
    checkTokens(){
      if(this.tokensOrder.length<this.waiting.tokens.length) return;
      if(JSON.stringify(this.tokensOrder)===JSON.stringify(this.waiting.solution)){ this.resolve(this.tokensOrder.join(' '), this.waiting.ok, this.chars[0].id, true); }
      else { this.tokensErr=true; this.tokensTries++; this.sfx('wrong'); }
    },
    revealTokens(){ var sol=this.waiting.solution; this.resolve(sol.join(' '), 'Ordre correct : '+sol.join(' ')+'.', this.chars[0].id, false); },
    submitBlank(opt){
      this.blankPick=opt;
      if(_norm(opt)!==_norm(this.waiting.answer)){ this.blankErr=true; this.blankPunctMsg=false; this.sfx('wrong'); return; }
      if(this.waiting.check_punctuation && !_hasFinalPunct(opt)){ this.blankErr=true; this.blankPunctMsg=true; return; }
      this.blankErr=false; this.blankPunctMsg=false;
      var full=this.waiting.parts[0]+opt+this.waiting.parts[1], self=this;
      setTimeout(function(){ self.resolve(full, self.waiting.ok||'Bonne réponse !', self.chars[0].id, true); }, 240);
    },

    doBurst(){ var self=this; this.sparks=Array.from({length:10},function(_,i){ var a=i/10*Math.PI*2; return {id:i,dx:Math.round(Math.cos(a)*46),dy:Math.round(Math.sin(a)*46)}; }); this.burst=true; setTimeout(function(){ self.burst=false; },520); },
    sfx(kind){
      if(this.sfxMuted) return;
      try{ var ac=this._ac||(this._ac=new (window.AudioContext||window.webkitAudioContext)()); if(ac.state==='suspended')ac.resume();
        var now=ac.currentTime, beep=function(f,t0,dur,type,g){ var o=ac.createOscillator(),ga=ac.createGain(); o.type=type||'sine'; o.frequency.value=f; ga.gain.setValueAtTime(0,now+t0); ga.gain.linearRampToValueAtTime(g||.06,now+t0+.008); ga.gain.exponentialRampToValueAtTime(.0001,now+t0+dur); o.connect(ga); ga.connect(ac.destination); o.start(now+t0); o.stop(now+t0+dur); };
        if(kind==='tap') beep(500,0,.07,'sine',.04);
        else if(kind==='success'){ beep(660,0,.1,'sine',.06); beep(880,.08,.16,'sine',.06); }
        else if(kind==='wrong') beep(160,0,.16,'sawtooth',.04);
        else if(kind==='win'){ beep(660,0,.12,'sine',.06); beep(880,.1,.12,'sine',.06); beep(1046,.2,.22,'sine',.07); }
      }catch(e){}
    },
    speak(text){ if(!this.ttsOn||!window.speechSynthesis) return; window.speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(text); u.lang='fr-FR'; u.rate=.97; window.speechSynthesis.speak(u); },
    speakNow(text){ if(!window.speechSynthesis) return; window.speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(text); u.lang='fr-FR'; u.rate=.97; window.speechSynthesis.speak(u); },
    toggleTts(){ this.ttsOn=!this.ttsOn; if(!this.ttsOn&&window.speechSynthesis) window.speechSynthesis.cancel(); },
    stopAll(){ if(window.speechSynthesis) window.speechSynthesis.cancel(); },

    onDone(){
      this.persistCompletion(); this.sfx('win');
      var self=this,target=this.score,t0=performance.now(); this.displayScore=0;
      (function ramp(now){ var p=Math.min(1,(now-t0)/750); self.displayScore=Math.round(target*(1-Math.pow(1-p,2))); if(p<1) requestAnimationFrame(ramp); })(t0);
      var cols=['#FB7185','#22D3EE','#FBBF24','#A855F7','#34D399', this.accentReadable];
      this.confetti=Array.from({length:36},function(_,i){ return {id:i,l:Math.round(Math.random()*100),color:cols[i%cols.length],dur:(1.8+Math.random()*1.6).toFixed(2),delay:(Math.random()*1.2).toFixed(2)}; });
      this.refreshIcons();
    },
    persistCompletion(){ if(!this.finishUrl||this.finished) return; this.finished=true; var self=this; fetch(this.finishUrl,{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':STORY_CFG.csrf},body:JSON.stringify({score:this.score,answers:[]})}).catch(function(){ self.finished=false; }); },
    restart(){ this.stopAll(); this.step=0; this.history=[]; this.typing=null; this.waiting=null; this.done=false; this.correct=0; this.confetti=[]; this.finished=false; this.displayScore=0; this.advance(); },
  }; });
});
</script>

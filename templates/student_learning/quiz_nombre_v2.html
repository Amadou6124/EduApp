{% load static l10n %}{% localize off %}
<!DOCTYPE html>
<html lang="fr" class="theme-dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <title>{{ lesson.title }} — Quiz</title>
  <link rel="stylesheet" href="{% static 'vendor/fonts/manrope/manrope.css' %}">
  <script defer src="{% static 'vendor/lucide/lucide.min.js' %}"></script>
  <script defer src="{% static 'vendor/alpine/alpine.min.js' %}"></script>

  {{ questions|json_script:"qn-data" }}

  <style>
    /* ── variables partagées avec les écrans v2 ── */
    .theme-dark {
      --bg: radial-gradient(120% 90% at 20% -10%, #1a1340 0%, #0b0b1a 55%, #07060f 100%);
      --solid-bg: #0b0b1a;
      --text: #ffffff;
      --text-dim: rgba(255,255,255,.58);
      --text-mute: rgba(255,255,255,.38);
      --surface: rgba(255,255,255,.05);
      --surface-2: rgba(255,255,255,.09);
      --border: rgba(255,255,255,.09);
      --track: rgba(255,255,255,.14);
    }
    *, *::before, *::after { box-sizing: border-box }
    html, body { margin: 0; height: 100%; }
    ::-webkit-scrollbar { width: 0 }
    body {
      font-family: 'Manrope', system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      overflow: hidden; -webkit-font-smoothing: antialiased;
    }
    [x-cloak] { display: none !important }

    /* ── animations ── */
    @keyframes quizPop {
      from { opacity: 0; transform: translateX(22px) scale(.97) }
      to   { opacity: 1; transform: translateX(0)    scale(1)   }
    }
    @keyframes feedbackIn {
      from { opacity: 0; transform: translateY(16px) scale(.97) }
      to   { opacity: 1; transform: translateY(0)    scale(1)   }
    }
    @keyframes numPop {
      0%   { transform: scale(1) }
      40%  { transform: scale(1.07) }
      100% { transform: scale(1) }
    }
    @keyframes confettiFall {
      0%   { transform: translateY(-80px) rotate(0deg);   opacity: 1 }
      100% { transform: translateY(105vh) rotate(720deg); opacity: 0 }
    }
    @keyframes starPop {
      0%   { transform: scale(0) }
      60%  { transform: scale(1.3) }
      100% { transform: scale(1) }
    }

    /* ── layout principal (identique quiz_choisir_v2) ── */
    .quizPanel {
      position: fixed; inset: 0; z-index: 70;
      display: flex; flex-direction: column;
      background: var(--bg); color: var(--text);
      max-width: 560px; margin: 0 auto;
    }
    .quiz-header {
      display: flex; align-items: center; gap: 12px;
      padding: 18px 18px 0; flex-shrink: 0;
    }
    .iconBtn {
      width: 40px; height: 40px; border-radius: 12px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text); display: flex; align-items: center;
      justify-content: center; cursor: pointer; flex-shrink: 0;
      transition: background .15s;
    }
    .iconBtn:hover { background: var(--surface-2) }
    .iconBtn:active { transform: scale(.92) }
    .quiz-body {
      flex: 1; overflow-y: auto; min-height: 0;
      padding: 20px 18px 4px;
      display: flex; flex-direction: column;
      animation: quizPop .3s cubic-bezier(.2,.9,.3,1);
    }
    .q-badge {
      font-size: 11px; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase; color: var(--accent); margin-bottom: 10px;
    }
    .q-instruction {
      font-size: 20px; font-weight: 800; line-height: 1.4;
      margin: 0 0 28px;
    }

    /* ── grand champ numérique central ── */
    .num-wrap {
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      padding: 8px 0 4px;
    }
    .num-input {
      width: 100%; max-width: 300px;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 20px;
      color: var(--text);
      font-family: 'Manrope', system-ui, sans-serif;
      font-size: 52px; font-weight: 800; text-align: center;
      padding: 20px 24px;
      outline: none;
      transition: border-color .15s, box-shadow .15s, transform .12s;
      /* Supprime les flèches natifs des inputs number */
      -moz-appearance: textfield;
    }
    .num-input::-webkit-inner-spin-button,
    .num-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .num-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 20%, transparent);
    }
    .num-input:disabled { opacity: .6; cursor: default }
    .num-input.input-ok {
      border-color: #22C55E;
      box-shadow: 0 0 0 4px rgba(34,197,94,.2);
      animation: numPop .25s cubic-bezier(.34,1.56,.64,1);
    }
    .num-input.input-ko {
      border-color: #EF4444;
      box-shadow: 0 0 0 4px rgba(239,68,68,.2);
    }
    .unit-label {
      font-size: 16px; font-weight: 700; color: var(--text-mute);
      letter-spacing: .5px;
    }

    /* ── valeurs tirées dans dynamic_formula ── */
    .var-num {
      color: var(--accent); font-weight: 900; font-style: normal;
      background: color-mix(in srgb, var(--accent) 14%, transparent);
      border-radius: 7px; padding: 1px 7px;
    }
    /* badge "tirage aléatoire" affiché sous l'instruction */
    .draw-badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 11px; font-weight: 700; letter-spacing: .5px;
      color: var(--text-mute); margin-bottom: 20px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 5px 10px;
    }

    /* ── feedback Duolingo (identique quiz_choisir_v2) ── */
    .fb-panel {
      border-radius: 16px; padding: 14px 16px; margin-top: 14px;
      animation: feedbackIn .22s cubic-bezier(.2,.9,.3,1);
    }
    .fb-ok { background: rgba(34,197,94,.12);  border: 1px solid rgba(34,197,94,.3) }
    .fb-ko { background: rgba(239,68,68,.12);  border: 1px solid rgba(239,68,68,.3) }
    .fb-title {
      display: flex; align-items: center; gap: 7px;
      font-size: 15px; font-weight: 800; margin: 0 0 5px;
    }
    .fb-ok .fb-title { color: #22C55E }
    .fb-ko .fb-title { color: #EF4444 }
    .fb-expl { font-size: 13px; color: var(--text-dim); margin: 0; line-height: 1.55 }

    /* ── hint virgule → point ── */
    .comma-hint {
      font-size: 12px; color: var(--text-mute); text-align: center;
      margin-top: 6px;
    }

    /* ── footer actions ── */
    .quiz-footer {
      padding: 10px 18px calc(14px + env(safe-area-inset-bottom));
      flex-shrink: 0; min-height: 72px;
      display: flex; align-items: flex-end;
    }
    .ctaBtn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; border: none; border-radius: 14px; color: #fff;
      font-family: 'Manrope', system-ui, sans-serif;
      font-weight: 800; font-size: 16px; padding: 15px 20px;
      cursor: pointer; transition: transform .12s, filter .12s;
    }
    .ctaBtn:active  { transform: scale(.97) }
    .ctaBtn:disabled { cursor: default; opacity: .38 }
    .cta-verify      { background: var(--accent) }
    .cta-continue-ok { background: linear-gradient(135deg, #22C55E, #16A34A) }
    .cta-continue-ko { background: var(--surface-2); border: 1px solid var(--border) }

    /* ── écran final ── */
    .final-wrap {
      position: fixed; inset: 0; z-index: 80; overflow-y: auto;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; background: var(--bg);
      padding: 32px 24px calc(32px + env(safe-area-inset-bottom));
      animation: quizPop .4s cubic-bezier(.2,.9,.3,1);
    }
    .trophy-ring {
      width: 110px; height: 110px; border-radius: 50%;
      background: linear-gradient(150deg, var(--accent), #6d28d9);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 16px 40px color-mix(in srgb, var(--accent) 50%, transparent);
      margin-bottom: 22px;
    }
    .miniCard {
      display: flex; flex-direction: column; align-items: center;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 18px; padding: 16px 22px; min-width: 108px;
    }
    .confetti-piece {
      position: fixed; pointer-events: none; z-index: 90;
      animation: confettiFall var(--dur,1.5s) ease-in var(--delay,0s) forwards;
    }
  </style>
</head>
<body>

<div x-data="quizShell()" x-cloak @quiz:answered.window="advance($event.detail)">

  <!-- ══════════════════════════════════════════════════════
       PHASE : quiz
  ══════════════════════════════════════════════════════ -->
  <template x-if="phase === 'quiz'">
    <div class="quizPanel" style="--accent:{{ lesson.color }}">

      <!-- HEADER : fermer + segments de progression -->
      <div class="quiz-header">
        <button class="iconBtn" @click="history.back()">
          <i data-lucide="x" style="width:18px;height:18px"></i>
        </button>
        <div style="display:flex;gap:5px;flex:1;align-items:center">
          <template x-for="i in questions.length" :key="i">
            <div style="flex:1;height:7px;border-radius:7px;transition:background .35s"
              :style="`background:${ (i-1)<idx ? 'var(--accent)' : (i-1)===idx ? 'color-mix(in srgb, var(--accent) 55%, transparent)' : 'var(--track)' }`">
            </div>
          </template>
        </div>
        <div style="font-size:12px;font-weight:700;color:var(--text-mute);white-space:nowrap;min-width:30px;text-align:right">
          <span x-text="idx+1"></span>/<span x-text="questions.length"></span>
        </div>
      </div>

      <!-- Force le remontage du bloc actif quand idx change (y compris même type). -->
      <!-- x-for d'un tableau d'un seul élément [idx] avec :key="idx" : Alpine voit -->
      <!-- une clé différente à chaque avancement et détruit/recrée tout le sous-arbre. -->
      <template x-for="_ in [idx]" :key="idx">
        <div style="flex:1;display:flex;flex-direction:column;min-height:0">

      <!-- ─────────────────────── number_input ─────────────────────── -->
      <template x-if="q.type === 'number_input'">
        <div x-data="blockNumberInput(q)" style="flex:1;display:flex;flex-direction:column;min-height:0">
          <div class="quiz-body">
            <div class="q-badge">Saisie numérique · Question <span x-text="$root.idx+1"></span> / {{ n_questions }}</div>
            <h2 class="q-instruction" x-text="quiz.instruction"></h2>

            <div class="num-wrap">
              <input
                type="text"
                inputmode="decimal"
                class="num-input"
                :class="checked ? (isRight ? 'input-ok' : 'input-ko') : ''"
                placeholder="?"
                autocomplete="off"
                x-model="input"
                :disabled="checked"
                @keydown.enter="!checked && canCheck && check()"
                x-ref="numfield"
              >
              <div x-show="quiz.unit" class="unit-label" x-text="quiz.unit"></div>
              <p class="comma-hint" x-show="!checked">
                Saisie décimale : utilise <strong>.</strong> ou <strong>,</strong>
              </p>
            </div>

            <div x-show="checked" x-cloak class="fb-panel" :class="isRight ? 'fb-ok' : 'fb-ko'">
              <p class="fb-title">
                <i :data-lucide="isRight ? 'check-circle' : 'x-circle'" style="width:17px;height:17px"></i>
                <span x-text="isRight
                  ? 'Bravo !'
                  : 'Bonne réponse : ' + quiz.answer + (quiz.unit ? ' ' + quiz.unit : '')">
                </span>
              </p>
              <p class="fb-expl" x-text="quiz.explanation"></p>
            </div>
          </div>
          <div class="quiz-footer">
            <button x-show="!checked" class="ctaBtn cta-verify" x-cloak
              :disabled="!canCheck" @click="check()">
              Vérifier
            </button>
            <button x-show="checked" class="ctaBtn" x-cloak
              :class="isRight ? 'cta-continue-ok' : 'cta-continue-ko'"
              @click="go()">
              Continuer <i data-lucide="arrow-right" style="width:18px;height:18px"></i>
            </button>
          </div>
        </div>
      </template>

      <!-- ─────────────────────── dynamic_formula ─────────────────────── -->
      <template x-if="q.type === 'dynamic_formula'">
        <div x-data="blockDynamicFormula(q)" style="flex:1;display:flex;flex-direction:column;min-height:0">
          <div class="quiz-body">
            <div class="q-badge">Formule · Question <span x-text="$root.idx+1"></span> / {{ n_questions }}</div>

            <!--
              Instruction avec valeurs tirées injectées via x-html.
              Les <span class="var-num"> sont générés par _render() côté JS,
              jamais depuis une entrée utilisateur — x-html est sûr ici.
            -->
            <h2 class="q-instruction" x-html="renderedInstruction"></h2>

            <!-- badge DÉMO : avertit que le tirage est simulé côté client -->
            <div class="draw-badge" x-show="!checked">
              <i data-lucide="shuffle" style="width:12px;height:12px"></i>
              Valeurs tirées aléatoirement — change à chaque rechargement
            </div>

            <div class="num-wrap">
              <input
                type="text"
                inputmode="decimal"
                class="num-input"
                :class="checked ? (isRight ? 'input-ok' : 'input-ko') : ''"
                placeholder="?"
                autocomplete="off"
                x-model="input"
                :disabled="checked"
                @keydown.enter="!checked && canCheck && check()"
              >
              <div x-show="quiz.unit" class="unit-label" x-text="quiz.unit"></div>
              <p class="comma-hint" x-show="!checked">
                Saisie décimale : utilise <strong>.</strong> ou <strong>,</strong>
              </p>
            </div>

            <div x-show="checked" x-cloak class="fb-panel" :class="isRight ? 'fb-ok' : 'fb-ko'">
              <p class="fb-title">
                <i :data-lucide="isRight ? 'check-circle' : 'x-circle'" style="width:17px;height:17px"></i>
                <span x-text="isRight
                  ? 'Bravo !'
                  : 'Bonne réponse : ' + expectedAnswer + (quiz.unit ? ' ' + quiz.unit : '')">
                </span>
              </p>
              <p class="fb-expl" x-text="quiz.explanation"></p>
            </div>
          </div>
          <div class="quiz-footer">
            <button x-show="!checked" class="ctaBtn cta-verify" x-cloak
              :disabled="!canCheck" @click="check()">
              Vérifier
            </button>
            <button x-show="checked" class="ctaBtn" x-cloak
              :class="isRight ? 'cta-continue-ok' : 'cta-continue-ko'"
              @click="go()">
              Continuer <i data-lucide="arrow-right" style="width:18px;height:18px"></i>
            </button>
          </div>
        </div>
      </template>

        </div><!-- /x-for inner wrapper -->
      </template><!-- /x-for [idx] -->

    </div><!-- /quizPanel -->
  </template>

  <!-- ══════════════════════════════════════════════════════
       PHASE : done (écran final — identique quiz_choisir_v2)
  ══════════════════════════════════════════════════════ -->
  <template x-if="phase === 'done'">
    <div class="final-wrap" style="--accent:{{ lesson.color }}"
      x-init="$nextTick(()=>{ if(window.lucide) lucide.createIcons(); spawnConfetti(); })">
      <div class="trophy-ring">
        <i data-lucide="trophy" style="width:52px;height:52px;color:#fff"></i>
      </div>
      <h2 style="font-size:26px;font-weight:800;margin:0 0 4px;text-align:center">
        <span x-text="endTitle"></span>
      </h2>
      <p style="color:var(--text-dim);margin:0 0 6px;text-align:center;font-size:14px">
        {{ lesson.title }}
      </p>
      <div style="display:flex;gap:6px;margin:14px 0 22px">
        <template x-for="i in 3" :key="i">
          <i data-lucide="star"
            :style="`width:36px;height:36px;color:#FBBF24;
              ${ (i-1)<stars ? 'fill:#FBBF24;animation:starPop .4s cubic-bezier(.34,1.56,.64,1) '+((i-1)*.12)+'s both' : 'opacity:.25' }`">
          </i>
        </template>
      </div>
      <div style="display:flex;gap:10px;margin-bottom:32px">
        <div class="miniCard">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
            <i data-lucide="check-circle" style="width:20px;height:20px;color:#22C55E"></i>
            <span style="font-size:28px;font-weight:800" x-text="score + '/' + questions.length"></span>
          </div>
          <div style="font-size:12px;color:var(--text-dim)">bonnes réponses</div>
        </div>
        <div class="miniCard">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
            <i data-lucide="gem" style="width:20px;height:20px;color:var(--accent)"></i>
            <span style="font-size:28px;font-weight:800" x-text="'+'+xp"></span>
          </div>
          <div style="font-size:12px;color:var(--text-dim)">XP gagnés</div>
        </div>
      </div>
      <button class="ctaBtn" @click="history.back()"
        style="width:min(360px,90%);background:linear-gradient(150deg, var(--accent), #6d28d9)">
        Terminer <i data-lucide="check" style="width:18px;height:18px"></i>
      </button>
    </div>
  </template>

</div><!-- /quizShell -->

<script>
{% verbatim %}
const _QN = JSON.parse(document.getElementById('qn-data').textContent);

// ══════════════════════════════════════════════════════════════════════════════
// Port JS de _safe_eval_arith (services.py:1532).
//
// Recursive descent parser : autorise uniquement constantes numériques,
// noms de variables (résolus depuis `vars`), et +  −  *  /  **  %  ().
// Aucun eval() brut — toute expression invalide lève une erreur.
//
// ⚠  SIMULATION DÉMO UNIQUEMENT.
//    En production, draw_dynamic_formula() est appelé SERVER-SIDE.
//    Les variables tirées et la réponse attendue (expectedAnswer) ne
//    doivent JAMAIS transiter par le client — risque d'anti-triche cassé
//    (un élève pourrait lire la réponse dans l'état Alpine / le DOM).
// ══════════════════════════════════════════════════════════════════════════════
function safeEvalArith(expr, vars) {
  let i = 0;
  const s = expr;

  function ws()   { while (i < s.length && s[i] === ' ') i++; }

  function primary() {
    ws();
    // Parenthèse
    if (s[i] === '(') {
      i++;
      const v = addSub(); ws();
      if (s[i] === ')') i++;
      return v;
    }
    // Unaire
    if (s[i] === '-') { i++; ws(); return -primary(); }
    if (s[i] === '+') { i++; ws(); return +primary(); }
    // Nombre (doit commencer par un chiffre — pas de .3 sans 0 devant)
    if (/\d/.test(s[i])) {
      let n = '';
      while (i < s.length && /[\d.]/.test(s[i])) n += s[i++];
      return parseFloat(n);
    }
    // Variable (lettres, chiffres, tiret-bas — commence par lettre)
    if (/[a-zA-Z_]/.test(s[i])) {
      let nm = '';
      while (i < s.length && /[a-zA-Z_0-9]/.test(s[i])) nm += s[i++];
      if (nm in vars) return vars[nm];
      throw new Error('variable inconnue : ' + nm);
    }
    throw new Error('token inattendu : ' + (s[i] || 'EOF'));
  }

  function power() {
    let v = primary(); ws();
    // ** (puissance) — droite-associatif
    while (i + 1 < s.length && s[i] === '*' && s[i + 1] === '*') {
      i += 2; ws();
      v = Math.pow(v, primary()); ws();
    }
    return v;
  }

  function mulDiv() {
    let v = power(); ws();
    while (i < s.length && (s[i] === '*' || s[i] === '/' || s[i] === '%')) {
      if (s[i] === '*' && s[i + 1] === '*') break; // ** géré par power()
      const op = s[i++]; ws();
      const r  = power(); ws();
      v = op === '*' ? v * r : op === '/' ? v / r : v % r;
    }
    return v;
  }

  function addSub() {
    let v = mulDiv(); ws();
    while (i < s.length && (s[i] === '+' || s[i] === '-')) {
      const op = s[i++]; ws();
      v = op === '+' ? v + mulDiv() : v - mulDiv(); ws();
    }
    return v;
  }

  return addSub();
}

// ══════════════════════════════════════════════════════════════════════════════
// Shell + blocs Alpine
// ══════════════════════════════════════════════════════════════════════════════
document.addEventListener('alpine:init', () => {

  // ── Shell : gère la séquence ────────────────────────────────────────────────
  Alpine.data('quizShell', () => ({
    idx: 0,
    results: [],
    phase: 'quiz',
    questions: _QN,
    get q()        { return this.questions[this.idx]; },
    get score()    { return this.results.filter(Boolean).length; },
    get stars()    { const r = this.score / this.questions.length; return r >= .85 ? 3 : r >= .6 ? 2 : r > 0 ? 1 : 0; },
    get xp()       { return this.score * 10; },
    get endTitle() { return this.stars === 3 ? 'Parfait !' : this.stars === 2 ? 'Bien joué !' : this.stars === 1 ? 'Courage !' : 'À retravailler'; },
    advance(detail) {
      this.results.push(detail.correct);
      setTimeout(() => {
        if (this.idx + 1 >= this.questions.length) {
          this.phase = 'done';
        } else {
          this.idx++;
          this.$nextTick(() => { if (window.lucide) lucide.createIcons(); });
        }
      }, 170);
    },
    spawnConfetti() {
      if (this.stars === 0) return;
      const colors = ['#A78BFA','#F59E0B','#22C55E','#EF4444','#22D3EE','#FB7185','#FBBF24'];
      for (let k = 0; k < 44; k++) {
        const el = document.createElement('div');
        el.className = 'confetti-piece';
        const sz = 5 + Math.random() * 9;
        el.style.cssText = `left:${Math.random()*100}vw;top:0;width:${sz}px;height:${sz}px;
          background:${colors[k % colors.length]};
          --dur:${1.1 + Math.random() * 1.3}s;--delay:${Math.random() * .9}s;
          border-radius:${Math.random() > .45 ? '50%' : '2px'};`;
        document.body.appendChild(el);
        el.addEventListener('animationend', () => el.remove(), { once: true });
      }
    },
  }));

  // ── BLOC 1 : number_input ───────────────────────────────────────────────────
  // Règle (services.py:1661) : abs(float(saisie) − float(quiz.answer)) ≤ tol
  // Normalisation virgule→point : un élève francophone peut taper "3,14" → "3.14"
  Alpine.data('blockNumberInput', (quiz) => ({
    quiz,
    input: '',
    checked: false,
    isRight: false,
    init() { this.$nextTick(() => { if (window.lucide) lucide.createIcons(); }); },

    get normalized() {
      return parseFloat(String(this.input).trim().replace(',', '.'));
    },
    get canCheck() {
      return this.input.trim() !== '' && !isNaN(this.normalized);
    },

    check() {
      if (!this.canCheck) return;
      const tol = this.quiz.tolerance ?? 0;
      this.isRight = Math.abs(this.normalized - this.quiz.answer) <= tol;
      this.checked = true;
      this.$nextTick(() => { if (window.lucide) lucide.createIcons(); });
    },

    go() {
      this.$el.style.transition = 'opacity 150ms ease, transform 150ms ease';
      this.$el.style.opacity    = '0';
      this.$el.style.transform  = 'translateX(-18px) scale(.97)';
      setTimeout(() => { this.$dispatch('quiz:answered', { correct: this.isRight }); }, 155);
    },
  }));

  // ── BLOC 2 : dynamic_formula ────────────────────────────────────────────────
  // Règle (services.py:1576) : abs(float(saisie) − safeEvalArith(formula, vars)) ≤ tol
  //
  // ⚠  SIMULATION DÉMO : le tirage des variables et le calcul de expectedAnswer
  //    sont faits ICI côté client (dans init()).
  //    EN PRODUCTION, ce sont des données serveur (draw_dynamic_formula) :
  //      • draw_dynamic_formula() tire les valeurs et calcule la réponse attendue
  //      • ces données sont STOCKÉES côté serveur (session / ExamAttempt)
  //      • le client reçoit seulement l'énoncé rendu (instruction avec valeurs)
  //      • la réponse attendue n'est JAMAIS envoyée au navigateur
  //    → L'élève ne peut pas tricher en lisant l'état Alpine ou le DOM.
  Alpine.data('blockDynamicFormula', (quiz) => ({
    quiz,
    drawnVars: {},
    expectedAnswer: null,
    renderedInstruction: '',
    input: '',
    checked: false,
    isRight: false,

    init() {
      // Tirage local (DÉMO SEULEMENT — voir commentaire ci-dessus)
      this.drawnVars          = this._draw(this.quiz.variables);
      this.expectedAnswer     = safeEvalArith(this.quiz.solution_formula, this.drawnVars);
      this.renderedInstruction = this._render(this.quiz.instruction, this.drawnVars);
      this.$nextTick(() => { if (window.lucide) lucide.createIcons(); });
    },

    // Port JS de draw_dynamic_formula (services.py:1699-1704)
    _draw(variables) {
      const vals = {};
      for (const [name, spec] of Object.entries(variables)) {
        const { min, max, step = 1 } = spec;
        const n = Math.floor((max - min) / step);
        vals[name] = min + Math.floor(Math.random() * (n + 1)) * step;
      }
      return vals;
    },

    // Substitue {varName} → <span class="var-num">valeur</span> dans l'énoncé
    _render(template, vars) {
      let s = template;
      for (const [k, v] of Object.entries(vars)) {
        s = s.replaceAll('{' + k + '}', '<span class="var-num">' + v + '</span>');
      }
      return s;
    },

    get normalized() {
      return parseFloat(String(this.input).trim().replace(',', '.'));
    },
    get canCheck() {
      return this.input.trim() !== '' && !isNaN(this.normalized);
    },

    check() {
      if (!this.canCheck) return;
      const tol = this.quiz.tolerance ?? 0;
      this.isRight = Math.abs(this.normalized - this.expectedAnswer) <= tol;
      this.checked = true;
      this.$nextTick(() => { if (window.lucide) lucide.createIcons(); });
    },

    go() {
      this.$el.style.transition = 'opacity 150ms ease, transform 150ms ease';
      this.$el.style.opacity    = '0';
      this.$el.style.transform  = 'translateX(-18px) scale(.97)';
      setTimeout(() => { this.$dispatch('quiz:answered', { correct: this.isRight }); }, 155);
    },
  }));

});

document.addEventListener('DOMContentLoaded', () => {
  if (window.lucide) lucide.createIcons();
});

{% load static l10n %}<!DOCTYPE html>
<html lang="fr" class="theme-dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <title>{{ lesson.title }} — Quiz maths</title>
  <link rel="stylesheet" href="{% static 'vendor/fonts/manrope/manrope.css' %}">
  <!-- MathQuill (CDN cdnjs) + jQuery (dépendance) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/mathquill/0.10.1/mathquill.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/mathquill/0.10.1/mathquill.min.js"></script>
  <script defer src="{% static 'vendor/lucide/lucide.min.js' %}"></script>
  <script defer src="{% static 'vendor/alpine/alpine.min.js' %}"></script>

  {{ questions|json_script:"qm-questions" }}

  <style>
    .theme-dark{
      --bg:radial-gradient(120% 90% at 20% -10%, #1a1340 0%, #0b0b1a 55%, #07060f 100%);
      --solid-bg:#0b0b1a;
      --text:#ffffff; --text-dim:rgba(255,255,255,.58); --text-mute:rgba(255,255,255,.42);
      --surface:rgba(255,255,255,.05); --surface-2:rgba(255,255,255,.08); --border:rgba(255,255,255,.09);
      --track:rgba(255,255,255,.16);
    }
    *{box-sizing:border-box} html,body{margin:0;height:100%} ::-webkit-scrollbar{width:0}
    body{font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased}
    .flex{display:flex}.items-center{align-items:center}
    [x-cloak]{display:none!important}
    @keyframes quizPop{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:scale(1)}}
    @keyframes titleIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .quizPanel{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;background:var(--bg);color:var(--text);
      padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;animation:quizPop .3s cubic-bezier(.2,.9,.3,1)}
    .quizQ{animation:titleIn .35s cubic-bezier(.2,.9,.3,1)}
    .iconBtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
    .iconBtn:active{transform:scale(.94)}
    .ctaBtn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:14px;color:#fff;font-weight:800;font-size:16px;padding:13px 20px;cursor:pointer;transition:transform .15s,filter .15s}
    .ctaBtn:active{transform:scale(.97)} .ctaBtn:disabled{cursor:default}
    .fbBanner{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:14px;margin-bottom:12px;animation:titleIn .25s ease;font-weight:700}
    .miniCard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px;color:var(--text);text-align:center}
    /* MathQuill field */
    #mqfield{font-size:26px;min-height:66px;width:100%;display:block;padding:16px;border-radius:16px;
      background:var(--surface);border:2px solid var(--border);color:var(--text);overflow-x:auto;white-space:nowrap}
    #mqfield.mq-focused{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)22}
    #mqfield.mq-editable-field{width:100%} #mqfield .mq-root-block{min-height:34px;padding:0}
    .mq-editable-field, .mq-math-mode{color:var(--text)}
    /* clavier symboles */
    .kpad{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:14px}
    .kbtn{height:46px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text);
      font-size:17px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .1s,background .15s}
    .kbtn:hover{background:var(--surface-2)} .kbtn:active{transform:scale(.92)}
    .kbtn.accent{background:var(--accent)1f;border-color:var(--accent)55;color:var(--accent)}
  </style>
</head>
<body>
{% localize off %}
<div class="quizPanel" x-data="mathquiz()" style="--accent:{{ lesson.color }}">

  <!-- en cours -->
  <template x-if="!done">
    <div style="display:flex;flex-direction:column;flex:1;min-height:0">
      <!-- header : close + segments -->
      <div class="flex items-center" style="gap:12px;margin-bottom:22px">
        <button class="iconBtn" @click="history.back()"><i data-lucide="x" style="width:18px;height:18px"></i></button>
        <div class="flex" style="gap:5px;flex:1">
          <template x-for="i in nQuestions" :key="i">
            <div :style="`flex:1;height:8px;border-radius:8px;transition:background .3s;background:${(i-1)<idx ? 'var(--accent)' : (i-1)===idx ? 'var(--accent)77' : 'var(--track)'}`"></div>
          </template>
        </div>
      </div>

      <div class="quizQ" :key="idx" style="flex:1;min-height:0;overflow-y:auto">
        <div style="font-size:12px;font-weight:700;color:var(--accent);letter-spacing:1px;text-transform:uppercase">Question <span x-text="idx+1"></span> sur {{ n_questions }}</div>
        <h2 style="font-size:23px;font-weight:800;margin:10px 0 22px;line-height:1.3" x-text="cur.instruction"></h2>

        <!-- champ MathQuill -->
        <div style="font-size:11px;font-weight:700;color:var(--text-dim);letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px">Ta réponse</div>
        <span id="mqfield" x-ref="mq"></span>

        <!-- clavier de symboles -->
        {# @mousedown.prevent : le champ MathQuill ne perd JAMAIS le focus → curseur stable, insertion ordonnée #}
        <div class="kpad">
          <button type="button" class="kbtn" @mousedown.prevent="key('x')">x</button>
          <button type="button" class="kbtn" @mousedown.prevent="key('y')">y</button>
          <button type="button" class="kbtn accent" @mousedown.prevent="key('sq2')" title="Au carré">x²</button>
          <button type="button" class="kbtn accent" @mousedown.prevent="key('sqrt')" title="Racine">√</button>
          <button type="button" class="kbtn accent" @mousedown.prevent="key('frac')" title="Fraction">a∕b</button>
          <button type="button" class="kbtn" @mousedown.prevent="key('pi')">π</button>
          <button type="button" class="kbtn" @mousedown.prevent="key('bksp')" title="Effacer"><i data-lucide="delete" style="width:18px;height:18px"></i></button>
          <button type="button" class="kbtn" @mousedown.prevent="key('(')">(</button>
          <button type="button" class="kbtn" @mousedown.prevent="key(')')">)</button>
          <button type="button" class="kbtn" @mousedown.prevent="key('+')">+</button>
          <button type="button" class="kbtn" @mousedown.prevent="key('-')">−</button>
          <button type="button" class="kbtn" @mousedown.prevent="key('cdot')">×</button>
          <button type="button" class="kbtn" @mousedown.prevent="key('2')">2</button>
          <button type="button" class="kbtn" @mousedown.prevent="key('3')">3</button>
        </div>
      </div>

      <!-- feedback + actions -->
      <div style="padding-top:16px">
        <div class="fbBanner" x-show="checked" x-cloak
             :style="isRight ? 'background:rgba(34,197,94,.16);border:1px solid #22C55E;color:#22C55E' : 'background:rgba(239,68,68,.16);border:1px solid #EF4444;color:#EF4444'">
          <i data-lucide="check" x-show="isRight" x-cloak style="width:20px;height:20px"></i>
          <i data-lucide="alert-circle" x-show="!isRight" x-cloak style="width:20px;height:20px"></i>
          <span x-text="isRight ? 'Bravo, bonne réponse !' : 'Pas encore — réessaie, tu vas y arriver.'"></span>
        </div>
        <div x-show="checked && isRight" x-cloak style="font-size:13.5px;color:var(--text-dim);line-height:1.5;margin-bottom:12px" x-text="cur.explanation"></div>

        <button x-show="!checked" class="ctaBtn" @click="check()" style="width:100%;justify-content:center;background:linear-gradient(150deg, var(--accent), #6d28d9)">Vérifier</button>
        <button x-show="checked && isRight" x-cloak class="ctaBtn" @click="next()" style="width:100%;justify-content:center;background:linear-gradient(150deg,#22C55E,#16A34A)">
          <span x-text="idx+1 < nQuestions ? 'Continuer' : 'Voir le résultat'"></span> <i data-lucide="arrow-right" style="width:18px;height:18px"></i>
        </button>
        <button x-show="checked && !isRight" x-cloak class="ctaBtn" @click="retry()" style="width:100%;justify-content:center;background:linear-gradient(150deg, var(--accent), #6d28d9)">Réessayer <i data-lucide="rotate-ccw" style="width:18px;height:18px"></i></button>
      </div>
    </div>
  </template>

  <!-- écran final -->
  <template x-if="done">
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px">
      <div style="width:110px;height:110px;border-radius:50%;background:linear-gradient(150deg, var(--accent), #6d28d9);display:flex;align-items:center;justify-content:center;box-shadow:0 16px 40px var(--accent)66;margin-bottom:22px"><i data-lucide="trophy" style="width:52px;height:52px;color:#fff"></i></div>
      <div class="flex" style="gap:6px;margin-bottom:14px">
        <template x-for="i in 3" :key="i">
          <i data-lucide="star" :style="`width:32px;height:32px;color:#FBBF24;${(i-1)<stars ? 'fill:#FBBF24' : ''}`"></i>
        </template>
      </div>
      <div style="font-size:26px;font-weight:800">Quiz terminé !</div>
      <div style="color:var(--text-dim);margin-top:6px;font-size:15px">{{ lesson.title }}</div>
      <div class="flex" style="gap:12px;margin:24px 0 28px">
        <div class="miniCard" style="width:120px"><div style="font-size:26px;font-weight:800;color:var(--accent)" x-text="correctCount+'/'+nQuestions"></div><div style="font-size:12px;color:var(--text-dim)">Bonnes réponses</div></div>
        <div class="miniCard" style="width:120px"><div class="flex items-center" style="gap:4px;justify-content:center"><i data-lucide="gem" style="width:20px;height:20px;color:#22D3EE"></i><span style="font-size:26px;font-weight:800" x-text="'+'+(correctCount*10)"></span></div><div style="font-size:12px;color:var(--text-dim)">XP gagnés</div></div>
      </div>
      <button class="ctaBtn" @click="history.back()" style="width:min(360px,90%);justify-content:center;background:linear-gradient(150deg, var(--accent), #6d28d9)">Terminer <i data-lucide="check" style="width:18px;height:18px"></i></button>
    </div>
  </template>
</div>

<script>
  // ── PONT : LaTeX (MathQuill) → format serveur (_eval_math_expression) ──
  // Le serveur normalise ensuite : lower + ^→** + suppression des espaces.
  // On vise donc une forme canonique : frac{a}{b}→(a)/(b), sqrt{a}→sqrt(a),
  // ^{n}→^n, \cdot→*, \pi→pi, on enlève les accolades restantes.
  function latexToServer(tex){
    let s = tex || '';
    s = s.replace(/\\left|\\right/g, '');
    s = s.replace(/\\[,;:! ]/g, '');          // espaces LaTeX (\, \; \! \ )
    s = s.replace(/\\cdot|\\times/g, '*');
    s = s.replace(/\\pi/g, 'pi');
    const frac = /\\frac\{([^{}]*)\}\{([^{}]*)\}/;
    while (frac.test(s)) s = s.replace(frac, '($1)/($2)');   // fractions (imbrication simple)
    const sq = /\\sqrt\{([^{}]*)\}/;
    while (sq.test(s)) s = s.replace(sq, 'sqrt($1)');
    s = s.replace(/\^\{([^{}]*)\}/g, '^$1');                  // x^{2} → x^2
    s = s.replace(/[{}]/g, '');                               // accolades restantes
    s = s.replace(/\\[a-zA-Z]+/g, '');                        // commandes LaTeX inconnues
    s = s.replace(/\\/g, '');
    return s.replace(/\s+/g, '');
  }
  // réplique exacte de _norm côté serveur
  function srvNorm(e){ return String(e).toLowerCase().replace(/\^/g,'**').replace(/\s+/g,''); }
  // Comparaison DÉMO tolérante : minuscule + sans espaces + sans * (unifie 2x / 2*x),
  // garde ^ et l'ordre des termes. Ne peut PAS rejeter la forme exacte correcte.
  function mathLoose(e){ return String(e).toLowerCase().replace(/\s+/g,'').replace(/\*/g,''); }

  function mathquiz(){
    return {
      questions: JSON.parse(document.getElementById('qm-questions').textContent),
      idx: 0, checked: false, isRight: false, done: false, correctCount: 0,
      nQuestions: {{ n_questions }},
      mf: null,
      get cur(){ return this.questions[this.idx]; },
      get stars(){ const p=this.correctCount/this.nQuestions; return p>=0.8?3:p>=0.5?2:1; },
      init(){
        this.$nextTick(()=>{ this.mountMQ(); if(window.lucide) lucide.createIcons(); });
      },
      mountMQ(){
        if(!window.MathQuill){ return; }
        const MQ = MathQuill.getInterface(2);
        this.mf = MQ.MathField(this.$refs.mq, {
          spaceBehavesLikeTab: true,
          handlers: { enter: () => this.check() },
        });
        this.mf.focus();
      },
      key(a){
        const mf = this.mf; if(!mf) return;
        switch(a){
          case 'sq2':  mf.write('^2'); break;          // « au carré » : x → x²
          case 'sqrt': mf.cmd('\\sqrt'); break;        // racine (curseur sous le radical)
          case 'frac': mf.cmd('\\frac'); break;        // fraction (curseur au numérateur)
          case 'pi':   mf.cmd('\\pi'); break;          // symbole π
          case 'cdot': mf.cmd('\\cdot'); break;        // multiplication ·
          case 'bksp': mf.keystroke('Backspace'); break;
          default:     mf.typedText(a);                // x, y, 2, 3, (, ), +, -  (frappe simulée)
        }
        mf.focus();
      },
      check(){
        if(this.checked || !this.mf) return;
        const tex = this.mf.latex();
        const out = latexToServer(tex);
        if(!out) return;                       // vide → ne rien faire
        const cands = [this.cur.correct].concat(this.cur.equivalents || []);
        this.isRight = cands.some(c => mathLoose(c) === mathLoose(out));
        this.checked = true;
        if(this.isRight) this.correctCount++;
        this.$nextTick(()=>window.lucide && lucide.createIcons());
      },
      retry(){ this.checked = false; if(this.mf) this.mf.focus(); },
      next(){
        if(this.idx + 1 < this.nQuestions){
          this.idx++; this.checked = false;
          if(this.mf) this.mf.latex('');
          this.$nextTick(()=>{ if(this.mf) this.mf.focus(); window.lucide && lucide.createIcons(); });
        } else {
          this.done = true;
          this.$nextTick(()=>window.lucide && lucide.createIcons());
        }
      },
    };
  }
  document.addEventListener('DOMContentLoaded', ()=>{ if(window.lucide) lucide.createIcons(); });
</script>
{% endlocalize %}
</body>
</html>

{% load static l10n %}{% localize off %}
<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  {# Pas de maximum-scale : un élève malvoyant doit pouvoir zoomer (accessibilité). #}
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{{ concept.name }} — Quiz</title>

  {# Thème AVANT peinture (évite le flash) : choix mémorisé, sinon clair. #}
  <script>(function(){try{document.documentElement.dataset.theme=localStorage.getItem('learn-theme')||'light';}catch(e){}})();</script>

  <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'vendor/fonts/nunito/nunito.css' %}">
  <!-- Prism.js — coloration code (spot_the_bug / parsons_puzzle). Synchrone : prêt au montage Alpine. -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-okaidia.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
  <!-- MathQuill (+ jQuery) — math_expression. defer AVANT Alpine pour être prêt au mount. -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/mathquill/0.10.1/mathquill.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/mathquill/0.10.1/mathquill.min.js"></script>
  <script src="{% static 'js/learn-sfx.js' %}"></script>
  <script defer src="{% static 'vendor/lucide/lucide.min.js' %}"></script>
  <script defer src="{% static 'vendor/alpine/alpine.min.js' %}"></script>

  {{ questions|json_script:"rq-data" }}
  <script>
    // Config injectée par Django (hors verbatim). Le runner valide CÔTÉ SERVEUR :
    // les questions ci-dessus n'ont PAS les champs-réponse (sécurité §A.5).
    const RUNNER_CFG = {
      answerUrl:   "{{ answer_url }}",
      parcoursUrl: "{{ parcours_url }}",
      csrf:        "{{ csrf_token }}",
      nQuestions:  {{ n_questions }},
      accent:      "{{ lesson.color }}",
    };
    LearnSFX.init("{% get_static_prefix %}vendor/sfx/");
  </script>

  <style>
    /* couche locale repointée sur les tokens ; --surface/-2, --border, --bg résolus par tokens.css.
       CONTRAT COULEUR (doctrine theme.py) : les ACTIONS restent CORAL (l'--accent des tokens,
       identique au login/parcours, calibré jour ET nuit) ; la couleur MATIÈRE ne vit que sur
       la carte-scène de la question (--scene). Succès/erreur : --ok/--ko avec variante nuit. */
    body {
      --text: var(--ink); --text-dim: var(--ink-muted); --text-mute: var(--ink-faint);
      --scene: var(--{{ hue }}-500);
      --ok: #1FA86A; --ko: #E5484D;
      --edge: rgba(0,0,0,.08);
    }
    [data-theme="dark"] body { --ok: #37D391; --ko: #FF7076; --edge: rgba(0,0,0,.45); }
    *, *::before, *::after { box-sizing: border-box }
    html, body { margin: 0; height: 100%; }
    ::-webkit-scrollbar { width: 0 }
    button, input, textarea { font-family: inherit }
    body {
      font-family: var(--font-ui);
      background: var(--bg); color: var(--ink);
      overflow: hidden; -webkit-font-smoothing: antialiased;
    }
    [x-cloak] { display: none !important }

    @keyframes quizPop { from { opacity:0; transform:translateX(22px) scale(.97) } to { opacity:1; transform:translateX(0) scale(1) } }
    @keyframes feedbackIn { from { opacity:0; transform:translateY(16px) scale(.97) } to { opacity:1; transform:translateY(0) scale(1) } }
    @keyframes confettiFall { 0% { transform:translateY(-80px) rotate(0); opacity:1 } 100% { transform:translateY(105vh) rotate(720deg); opacity:0 } }
    @keyframes starPop { 0% { transform:scale(0) } 60% { transform:scale(1.3) } 100% { transform:scale(1) } }

    .quizPanel { position:fixed; inset:0; z-index:70; display:flex; flex-direction:column; background:var(--bg); color:var(--text); max-width:560px; margin:0 auto; }
    .quiz-header { display:flex; align-items:center; gap:12px; padding:18px 18px 0; flex-shrink:0; }
    .iconBtn { width:44px; height:44px; border-radius:12px; border:1px solid var(--border); background:var(--surface); color:var(--text); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; transition:background .15s; }
    .iconBtn:hover { background:var(--surface-2) }
    .iconBtn:active { transform:scale(.92) }
    .prog-track { flex:1; height:12px; border-radius:99px; background:var(--track, var(--surface-2)); overflow:hidden; }
    .prog-fill { height:100%; border-radius:99px; background:var(--accent); transition:width .35s cubic-bezier(.2,.9,.3,1); }
    /* Combo : éteint (gris) → s'allume à 2 bonnes réponses d'affilée. Meurt à la 1re erreur. */
    .combo { display:flex; align-items:center; gap:3px; background:var(--surface); border:1px solid var(--border); border-radius:99px; padding:5px 10px; font-size:12px; font-weight:900; color:var(--text-mute); flex-shrink:0; filter:grayscale(1); opacity:.6; transition:all .25s; }
    .combo-on { filter:none; opacity:1; color:#C2660A; background:color-mix(in srgb, #F59E0B 14%, var(--surface)); border-color:color-mix(in srgb, #F59E0B 45%, transparent); animation:starPop .35s cubic-bezier(.34,1.56,.64,1); }
    [data-theme="dark"] .combo-on { color:#FFC24B }

    .quiz-body { flex:1; overflow-y:auto; min-height:0; padding:20px 18px 4px; display:flex; flex-direction:column; animation:quizPop .3s cubic-bezier(.2,.9,.3,1); }

    /* Carte-SCÈNE : la question en héros, teintée matière (SEUL endroit où vit --scene). */
    .q-scene { position:relative; background:linear-gradient(150deg, color-mix(in srgb, var(--scene) 13%, transparent), color-mix(in srgb, var(--scene) 6%, transparent)); border:1px solid color-mix(in srgb, var(--scene) 20%, transparent); border-radius:22px; padding:18px 16px 20px; margin:0 0 18px; overflow:hidden; flex-shrink:0; }
    .q-scene::after { content:''; position:absolute; top:-24px; right:-24px; width:92px; height:92px; border-radius:50%; background:color-mix(in srgb, var(--scene) 9%, transparent); pointer-events:none; }
    .q-scene-row { position:relative; display:flex; justify-content:space-between; align-items:flex-start; gap:10px; z-index:1; }
    .q-instruction { font-size:21px; font-weight:800; line-height:1.38; margin:0; }
    .q-audio { flex-shrink:0; width:44px; height:44px; border-radius:50%; border:1px solid var(--border); background:var(--surface); font-size:17px; cursor:pointer; box-shadow:0 3px 0 var(--edge); }
    .q-audio:active { transform:translateY(2px); box-shadow:0 1px 0 var(--edge) }

    /* Cascade d'apparition (60 ms d'écart). */
    @keyframes riseIn { from { opacity:0; transform:translateY(10px) } to { opacity:1; transform:none } }
    .options > *, .tf-grid > *, .kp-list > *, .ord-list > *, .match-col > * { animation:riseIn .32s cubic-bezier(.2,.9,.3,1) both; }
    .options > :nth-child(2), .tf-grid > :nth-child(2), .kp-list > :nth-child(2), .ord-list > :nth-child(2), .match-col > :nth-child(2) { animation-delay:.06s }
    .options > :nth-child(3), .kp-list > :nth-child(3), .ord-list > :nth-child(3), .match-col > :nth-child(3) { animation-delay:.12s }
    .options > :nth-child(4), .kp-list > :nth-child(4), .ord-list > :nth-child(4), .match-col > :nth-child(4) { animation-delay:.18s }
    .options > :nth-child(n+5), .kp-list > :nth-child(n+5), .ord-list > :nth-child(n+5), .match-col > :nth-child(n+5) { animation-delay:.24s }

    /* Secousse courte sur mauvaise réponse. */
    @keyframes shakeX { 0%,100% { transform:translateX(0) } 20% { transform:translateX(-7px) } 45% { transform:translateX(6px) } 70% { transform:translateX(-4px) } 85% { transform:translateX(2px) } }
    .shake-wrong { animation:shakeX .4s ease-out; }

    .options { display:flex; flex-direction:column; gap:11px; }
    /* Boutons-JOUETS : relief pressable (ombre dure dessous), la signature tactile. */
    .opt { display:flex; align-items:center; gap:12px; padding:13px 15px; min-height:52px; border-radius:16px; border:2px solid var(--border); background:var(--surface); color:var(--text); font-size:15px; font-weight:700; cursor:pointer; text-align:left; width:100%; box-shadow:0 3px 0 var(--edge); transition:border-color .13s, background .13s, transform .1s, opacity .15s, box-shadow .1s, color .13s; }
    .opt:hover:not(:disabled):not(.correct):not(.wrong):not(.selected) { border-color:color-mix(in srgb, var(--accent) 45%, var(--border)); }
    .opt:active:not(:disabled) { transform:translateY(2px); box-shadow:0 1px 0 var(--edge) }
    /* Sélection FRANCHE : remplissage coral (la marque) — plus de bordure timide. */
    .opt.selected { border-color:var(--accent-strong, var(--accent)); background:var(--accent); color:var(--accent-ink, #fff); box-shadow:0 3px 0 var(--btn-primary-edge, var(--edge)); }
    .opt.correct { border-color:var(--ok); background:var(--ok); color:#fff; box-shadow:0 3px 0 color-mix(in srgb, var(--ok) 60%, #000) }
    .opt.wrong { border-color:var(--ko); background:var(--ko); color:#fff; box-shadow:0 3px 0 color-mix(in srgb, var(--ko) 60%, #000) }
    .opt.dimmed { opacity:.38 }
    .opt-check { width:24px; height:24px; border-radius:8px; flex-shrink:0; border:2.5px solid color-mix(in srgb, var(--ink) 22%, transparent); background:transparent; display:flex; align-items:center; justify-content:center; transition:border-color .13s, background .13s; }
    /* Sur fond plein, la puce devient blanche et l'icône prend la couleur d'état. */
    .opt-check svg { color:#fff }
    .opt.selected .opt-check { border-color:#fff; background:#fff }
    .opt.selected .opt-check svg { color:var(--accent) }
    .opt.correct .opt-check { border-color:#fff; background:#fff }
    .opt.correct .opt-check svg { color:var(--ok) }
    .opt.wrong .opt-check { border-color:#fff; background:#fff }
    .opt.wrong .opt-check svg { color:var(--ko) }

    .tf-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    /* V/F : NEUTRES avant sélection (les couleurs n'arrivent qu'au feedback — sinon on
       dirait une correction déjà donnée). Relief-jouet comme les options. */
    .tf-card { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:34px 16px; border-radius:20px; gap:14px; border:2px solid var(--border); background:var(--surface); cursor:pointer; box-shadow:0 3px 0 var(--edge); transition:border-color .15s, background .15s, transform .12s, box-shadow .12s, color .15s; font-size:19px; font-weight:800; color:var(--text); }
    .tf-card:hover:not(.selected):not(.correct):not(.wrong) { border-color:color-mix(in srgb, var(--accent) 45%, var(--border)) }
    .tf-card:active { transform:translateY(2px); box-shadow:0 1px 0 var(--edge) }
    .tf-card.selected { border-color:var(--accent-strong, var(--accent)); background:var(--accent); color:var(--accent-ink, #fff); box-shadow:0 3px 0 var(--btn-primary-edge, var(--edge)) }
    .tf-card.correct { border-color:var(--ok); background:var(--ok); color:#fff; box-shadow:0 3px 0 color-mix(in srgb, var(--ok) 60%, #000) }
    .tf-card.wrong { border-color:var(--ko); background:var(--ko); color:#fff; box-shadow:0 3px 0 color-mix(in srgb, var(--ko) 60%, #000) }
    .tf-icon { width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:color-mix(in srgb, var(--ink) 7%, transparent); color:var(--text-dim); transition:background .15s, color .15s; }
    .tf-card.selected .tf-icon, .tf-card.correct .tf-icon, .tf-card.wrong .tf-icon { background:rgba(255,255,255,.25); color:#fff }

    .kp-list { display:flex; flex-direction:column; gap:0; }
    .kp-row { display:flex; align-items:center; gap:10px; padding:13px 0; border-bottom:1px solid var(--border); }
    .kp-row:last-child { border-bottom:none }
    .kp-text { flex:1; font-size:14px; line-height:1.5; color:var(--text) }
    .kp-toggles { display:flex; gap:6px; flex-shrink:0 }
    /* Cibles tactiles enfants : ≥44px visibles (V/F du k-prime). */
    .kp-btn { min-width:48px; min-height:44px; padding:8px 14px; border-radius:12px; font-size:15px; font-weight:800; border:1.5px solid var(--border); background:var(--surface); color:var(--text-dim); cursor:pointer; transition:border-color .12s, background .12s, color .12s; }
    .kp-btn:hover:not(:disabled) { background:var(--surface-2) }
    .kp-btn.kp-on-v { border-color:var(--accent); background:color-mix(in srgb, var(--accent) 16%, transparent); color:var(--text) }
    .kp-btn.kp-on-f { border-color:var(--accent); background:color-mix(in srgb, var(--accent) 16%, transparent); color:var(--text) }
    .kp-btn.kp-good { border-color:var(--ok); background:color-mix(in srgb, var(--ok) 20%, transparent); color:var(--ok) }
    .kp-btn.kp-bad { border-color:var(--ko); background:color-mix(in srgb, var(--ko) 20%, transparent); color:var(--ko) }

    /* cloze_test — texte à trous */
    .cloze-text { font-size:17px; line-height:2.3; font-weight:600; }
    .cloze-input { display:inline-block; min-width:96px; padding:5px 10px; margin:0 3px; border-radius:9px; border:1.5px solid var(--border); background:var(--surface); color:var(--text); font-family:inherit; font-size:15px; font-weight:700; text-align:center; }
    .cloze-input:focus { outline:none; border-color:var(--accent); }
    .cloze-input.correct { border-color:var(--ok); background:color-mix(in srgb, var(--ok) 13%, transparent); color:var(--ok) }
    .cloze-input.wrong { border-color:var(--ko); background:color-mix(in srgb, var(--ko) 13%, transparent); color:var(--ko) }
    .cloze-sol { display:inline-block; margin-left:4px; font-size:13px; font-weight:700; color:var(--ok) }

    /* mcq_multiple — état "oubliée" (bonne réponse non cochée) */
    .opt.missed { border-color:#F59E0B; background:rgba(245,158,11,.13); color:#F59E0B }
    .opt.missed .opt-check { border-color:#F59E0B; background:#F59E0B }
    .opt-tag { margin-left:auto; font-size:11px; font-weight:700; flex-shrink:0 }

    /* matching — grille tap-tap */
    @keyframes pairSnap { 0% { transform:scale(.9) } 60% { transform:scale(1.04) } 100% { transform:scale(1) } }
    .match-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; align-items:start; }
    .match-col { display:flex; flex-direction:column; gap:6px; }
    .match-card { display:flex; align-items:center; gap:6px; width:100%; padding:11px 10px; background:var(--surface); border:2px solid var(--border); border-radius:14px; box-shadow:0 2px 0 var(--edge); font-family:inherit; font-size:13px; font-weight:600; color:var(--text); cursor:pointer; line-height:1.35; min-height:52px; text-align:left; transition:border-color .14s, background .14s, box-shadow .14s, transform .1s; -webkit-tap-highlight-color:transparent; }
    .match-card:active:not(:disabled) { transform:scale(.95) }
    .match-card:disabled { cursor:default }
    .match-card.is-selected { border-color:var(--accent); background:color-mix(in srgb, var(--accent) 13%, transparent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 28%, transparent); }
    .match-card.is-linked { border-color:var(--pair-c); background:color-mix(in srgb, var(--pair-c) 13%, transparent); animation:pairSnap .22s cubic-bezier(.34,1.56,.64,1); }
    .match-card.is-correct { border-color:var(--ok); background:color-mix(in srgb, var(--ok) 15%, transparent) }
    .match-card.is-wrong { border-color:var(--ko); background:color-mix(in srgb, var(--ko) 15%, transparent) }
    .match-card-left { flex-direction:row; justify-content:space-between; }
    .match-card-right .pair-badge { order:-1; }
    .pair-badge { flex-shrink:0; width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:900; color:#000; background:var(--pair-c); }
    .match-hint { font-size:12px; color:var(--text-mute); text-align:center; margin:6px 0 0; }
    .assoc-list { margin:10px 0 6px; }
    .assoc-row { display:flex; align-items:center; gap:6px; padding:6px 0; border-bottom:1px solid rgba(255,255,255,.06); font-size:13px; line-height:1.35; }
    .assoc-row:last-child { border-bottom:none }
    .assoc-left { font-weight:700; flex:0 0 auto; max-width:42%; }
    .assoc-arr { color:var(--text-mute); flex-shrink:0; }
    .assoc-right { flex:1; color:var(--text-dim); }

    .fb-panel { border-radius:20px; padding:16px 18px; margin-top:18px; border-width:2px; animation:feedbackIn .22s cubic-bezier(.2,.9,.3,1); flex-shrink:0; }
    .fb-ok { background:color-mix(in srgb, var(--ok) 12%, transparent); border:1px solid color-mix(in srgb, var(--ok) 30%, transparent) }
    .fb-ko { background:color-mix(in srgb, var(--ko) 12%, transparent); border:1px solid color-mix(in srgb, var(--ko) 30%, transparent) }
    .fb-title { display:flex; align-items:center; gap:7px; font-size:17px; font-weight:900; margin:0 0 5px; }
    .fb-ok .fb-title { color:var(--ok) }
    .fb-ko .fb-title { color:var(--ko) }
    .fb-expl { font-size:13px; color:var(--text-dim); margin:0; line-height:1.55 }

    .quiz-footer { padding:10px 18px calc(14px + env(safe-area-inset-bottom)); flex-shrink:0; min-height:72px; display:flex; align-items:flex-end; }
    .ctaBtn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; border:none; border-radius:16px; color:var(--accent-ink, #fff); font-family:var(--font-ui); font-weight:900; font-size:17px; padding:16px 20px; min-height:56px; cursor:pointer; transition:transform .1s, filter .12s, box-shadow .1s; text-decoration:none; }
    .ctaBtn:not(:disabled):active { transform:translateY(3px) !important; box-shadow:0 1px 0 var(--edge) !important }
    .ctaBtn:active { transform:scale(.97) }
    /* Désactivé = clairement inactif (gris plat), pas un bouton coloré à moitié
       transparent qui SEMBLE cliquable. */
    .ctaBtn:disabled, .ctaBtn.cta-verify:disabled { cursor:default; background:var(--surface-2); color:var(--ink-faint); border:1px solid var(--border); opacity:1; box-shadow:0 3px 0 var(--edge) }
    .cta-verify { background:var(--accent); box-shadow:0 4px 0 var(--btn-primary-edge, var(--edge)) }
    .cta-continue-ok { background:var(--ok); color:#fff; box-shadow:0 4px 0 color-mix(in srgb, var(--ok) 60%, #000) }
    .cta-continue-ko { background:var(--surface); border:2px solid var(--border); color:var(--ink); box-shadow:0 4px 0 var(--edge) }

    .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
    .grid-2 .opt { justify-content:center; text-align:center; }

    /* chrono_order / parsons — lignes réordonnables */
    .ord-list { display:flex; flex-direction:column; gap:8px; }
    .ord-row { display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:14px; border:2px solid var(--border); background:var(--surface); box-shadow:0 2px 0 var(--edge); transition:border-color .14s, background .14s; }
    .ord-row.correct { border-color:var(--ok); background:color-mix(in srgb, var(--ok) 13%, transparent) }
    .ord-row.wrong { border-color:var(--ko); background:color-mix(in srgb, var(--ko) 13%, transparent) }
    .ord-rank { flex-shrink:0; width:24px; height:24px; border-radius:7px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; color:var(--text-dim) }
    .ord-text { flex:1; font-size:14px; font-weight:600; line-height:1.35; }
    /* Flèches ▲▼ et indentation : visuel compact mais ZONE TACTILE élargie (::after)
       — un doigt d'enfant doit toucher juste (≥ ~48px de zone réelle). */
    .ord-arrows { display:flex; flex-direction:column; gap:6px; flex-shrink:0 }
    .ord-arrow { position:relative; width:40px; height:32px; border-radius:9px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:13px; line-height:1; }
    .ord-arrow::after { content:''; position:absolute; inset:-7px; }
    .ord-arrow:disabled { opacity:.25; cursor:default }
    .ord-arrow:active:not(:disabled) { transform:scale(.9) }
    /* parsons : indentation + code mono */
    .ord-code { font-family:'Courier New', monospace; font-size:13px; white-space:pre; overflow-x:auto; }
    .ind-btns { display:flex; gap:7px; flex-shrink:0 }
    .ind-btn { position:relative; width:38px; height:32px; border-radius:9px; border:1px solid var(--border); background:var(--surface-2); color:var(--text-dim); font-size:15px; font-weight:800; cursor:pointer; display:flex; align-items:center; justify-content:center }
    .ind-btn::after { content:''; position:absolute; inset:-7px; }
    .ind-btn:disabled { opacity:.25; cursor:default }
    code[class*="language-"] { background:transparent !important; padding:0 !important }

    /* number_input / dynamic_formula — champ numérique */
    .num-wrap { display:flex; align-items:center; gap:10px; }
    .num-input { flex:1; padding:15px 16px; border-radius:16px; border:2px solid var(--border); background:var(--surface); box-shadow:0 3px 0 var(--edge); color:var(--text); font-family:inherit; font-size:22px; font-weight:800; text-align:center; }
    .num-input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent) }
    .num-input.correct { border-color:var(--ok); color:var(--ok) }
    .num-input.wrong { border-color:var(--ko); color:var(--ko) }
    .num-unit { font-size:16px; font-weight:700; color:var(--text-dim); flex-shrink:0 }
    .draw-tag { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; color:var(--accent); margin-bottom:10px; }

    /* spot_the_bug — code cliquable */
    .code-block { background:#1e1e2e; border-radius:14px; border:1px solid var(--border); overflow:hidden; user-select:none; }
    .code-line { display:flex; align-items:stretch; cursor:pointer; transition:background .1s; border-bottom:1px solid rgba(255,255,255,.04); }
    .code-line:last-child { border-bottom:none }
    .code-line:hover:not(.checked) { background:rgba(255,255,255,.06) }
    .code-line.ln-sel { background:color-mix(in srgb, var(--accent) 20%, transparent) }
    .code-line.ln-correct { background:color-mix(in srgb, var(--ok) 22%, transparent) !important }
    .code-line.ln-wrong { background:color-mix(in srgb, var(--ko) 22%, transparent) !important }
    .line-num { padding:10px 10px 10px 14px; font-size:12px; color:#555; min-width:40px; text-align:right; border-right:1px solid rgba(255,255,255,.05); font-family:'Courier New', monospace; flex-shrink:0; }
    .line-code { padding:10px 14px; font-family:'Courier New', monospace; font-size:13px; line-height:1.55; white-space:pre; overflow-x:auto; color:#e4e4e7; }
    .fix-hint { display:flex; align-items:center; gap:8px; margin-top:10px; padding:10px 14px; border-radius:10px; background:color-mix(in srgb, var(--ok) 12%, transparent); border:1px solid color-mix(in srgb, var(--ok) 28%, transparent); font-family:'Courier New', monospace; font-size:13px; color:var(--ok); }

    /* math_expression — MathQuill + clavier */
    .mq-field { font-size:24px; min-height:62px; width:100%; display:block; padding:14px 16px; border-radius:16px; background:var(--surface); border:2px solid var(--border); color:var(--text); overflow-x:auto; white-space:nowrap; }
    .mq-field.mq-focused { border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent) }
    .mq-editable-field, .mq-math-mode { color:var(--text) }
    .kpad { display:grid; grid-template-columns:repeat(7,1fr); gap:7px; margin-top:14px; }
    .kbtn { height:48px; border-radius:12px; border:1px solid var(--border); background:var(--surface); box-shadow:0 2px 0 var(--edge); color:var(--text); font-size:17px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:transform .1s, background .15s; }
    .kbtn:hover { background:var(--surface-2) } .kbtn:active { transform:scale(.92) }
    .kbtn.accent { background:color-mix(in srgb, var(--accent) 14%, transparent); border-color:color-mix(in srgb, var(--accent) 40%, transparent); color:var(--accent) }

    .final-wrap { position:fixed; inset:0; z-index:80; overflow-y:auto; display:flex; flex-direction:column; align-items:center; justify-content:center; background:var(--bg); padding:32px 24px calc(32px + env(safe-area-inset-bottom)); animation:quizPop .4s cubic-bezier(.2,.9,.3,1); }
    .trophy-ring { width:110px; height:110px; border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; box-shadow:0 16px 40px color-mix(in srgb, var(--accent) 50%, transparent); margin-bottom:22px; }
    .star-item { display:inline-flex; transition:transform .35s cubic-bezier(.34,1.56,.64,1); }
    .star-item.lit { animation:starPop .4s cubic-bezier(.34,1.56,.64,1) both }
    .miniCard { display:flex; flex-direction:column; align-items:center; background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:16px 22px; min-width:108px; }
    .confetti-piece { position:fixed; pointer-events:none; z-index:90; animation:confettiFall var(--dur,1.5s) ease-in var(--delay,0s) forwards; }

    .fallback-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:22px; text-align:center; color:var(--text-dim); }

    /* Modal « quitter le quiz ? » — confirmation douce, jamais de sortie par accident. */
    .exit-veil { position:fixed; inset:0; z-index:95; background:rgba(20,15,25,.45); display:flex; align-items:center; justify-content:center; padding:26px; animation:feedbackIn .18s ease-out; }
    .exit-card { background:var(--surface); border:1px solid var(--border); border-radius:22px; padding:24px 22px; max-width:330px; width:100%; text-align:center; }
    .exit-emoji { width:64px; height:64px; border-radius:50%; background:color-mix(in srgb, var(--accent) 14%, transparent); display:flex; align-items:center; justify-content:center; margin:0 auto 14px; font-size:30px; }
    .exit-title { font-size:18px; font-weight:800; margin:0 0 6px; color:var(--ink-strong, var(--ink)); }
    .exit-msg { font-size:13.5px; color:var(--text-dim); line-height:1.55; margin:0 0 18px; }
    .exit-stay { display:block; width:100%; border:none; border-radius:14px; background:var(--accent); color:#fff; font-family:inherit; font-weight:800; font-size:15px; padding:13px; cursor:pointer; margin-bottom:9px; min-height:48px; }
    .exit-stay:active { transform:scale(.97) }
    .exit-leave { display:block; width:100%; border:1px solid var(--border); border-radius:14px; background:transparent; color:var(--text-dim); font-family:inherit; font-weight:700; font-size:14px; padding:12px; cursor:pointer; text-decoration:none; min-height:44px; }
  </style>
</head>
<body>

<div x-data="quizShell()" x-cloak
     x-init="$nextTick(() => refreshIcons())"
     @quiz:answered.window="advance($event.detail)">

  <!-- ════════════════ PHASE QUIZ ════════════════ -->
  <template x-if="phase === 'quiz'">
    <div class="quizPanel">
      <div class="quiz-header">
        {# Sortie CONFIRMÉE : un enfant qui tape à côté ne doit pas perdre sa série. #}
        <button type="button" class="iconBtn" @click="confirmExit = true"><i data-lucide="x" style="width:20px;height:20px"></i></button>
        {# Plancher 5 % : dès la question 1 la barre montre « c'est parti », jamais vide. #}
        <div class="prog-track"><div class="prog-fill" :style="`width:${Math.max((idx/questions.length)*100, 5)}%`"></div></div>
        <div style="font-size:12px;font-weight:700;color:var(--text-mute);white-space:nowrap;min-width:30px;text-align:right">
          <span x-text="idx+1"></span>/<span x-text="questions.length"></span>
        </div>
        <div class="combo" :class="streak >= 2 ? 'combo-on' : ''" aria-label="Série de bonnes réponses">🔥<span x-text="'×' + streak"></span></div>
      </div>

      <!-- ───── mcq_single ───── -->
      <template x-if="q.type === 'mcq_single'">
        <div x-data="blockMcqSingle(q)" style="flex:1;display:flex;flex-direction:column;min-height:0">
          <div class="quiz-body" :class="checked && !isRight ? 'shake-wrong' : ''">
            <div class="q-scene"><div class="q-scene-row"><h2 class="q-instruction" x-text="frTypo(quiz.instruction)"></h2><button type="button" class="q-audio" x-show="$store.tts.ok" @click="$store.tts.speak(quiz.instruction)" aria-label="Écouter la question">🔊</button></div></div>
            <div class="options">
              <template x-for="(opt, i) in quiz.options" :key="i">
                <button class="opt" :class="optClass(i)" @click="!checked && (selected=i)" :disabled="checked || busy">
                  <span class="opt-check">
                    <i data-lucide="check" style="width:14px;height:14px" x-show="selected===i || optClass(i)==='correct'" x-cloak></i>
                    <i data-lucide="x" style="width:14px;height:14px" x-show="optClass(i)==='wrong'" x-cloak></i>
                  </span>
                  <span x-text="opt"></span>
                </button>
              </template>
            </div>
            <div x-show="checked" x-cloak class="fb-panel" :class="isRight ? 'fb-ok' : 'fb-ko'">
              <p class="fb-title"><i :data-lucide="isRight ? 'check-circle' : 'x-circle'" style="width:17px;height:17px"></i>
                <span x-text="isRight ? 'Bravo !' : 'Bonne réponse : ' + quiz.options[solution.answer_index]"></span></p>
              <p class="fb-expl" x-text="explanation"></p>
            </div>
          </div>
          <div class="quiz-footer">
            <button x-show="!checked" class="ctaBtn cta-verify" :disabled="selected===null || busy" @click="check()" x-cloak x-text="busy ? '…' : 'Vérifier'"></button>
            <button x-show="checked" class="ctaBtn" x-cloak :class="isRight ? 'cta-continue-ok' : 'cta-continue-ko'" @click="go()">Continuer <i data-lucide="arrow-right" style="width:18px;height:18px"></i></button>
          </div>
        </div>
      </template>

      <!-- ───── true_false ───── -->
      <template x-if="q.type === 'true_false'">
        <div x-data="blockTrueFalse(q)" style="flex:1;display:flex;flex-direction:column;min-height:0">
          <div class="quiz-body" :class="checked && !isRight ? 'shake-wrong' : ''">
            <div class="q-scene"><div class="q-scene-row"><h2 class="q-instruction" x-text="frTypo(quiz.instruction)"></h2><button type="button" class="q-audio" x-show="$store.tts.ok" @click="$store.tts.speak(quiz.instruction)" aria-label="Écouter la question">🔊</button></div></div>
            <div class="tf-grid">
              <button class="tf-card" :class="cardClass(true)" @click="!checked && (selected=true)" :disabled="checked || busy">
                <span class="tf-icon tf-true-icon"><i data-lucide="check" style="width:28px;height:28px"></i></span>Vrai
              </button>
              <button class="tf-card" :class="cardClass(false)" @click="!checked && (selected=false)" :disabled="checked || busy">
                <span class="tf-icon tf-false-icon"><i data-lucide="x" style="width:28px;height:28px"></i></span>Faux
              </button>
            </div>
            <div x-show="checked" x-cloak class="fb-panel" :class="isRight ? 'fb-ok' : 'fb-ko'">
              <p class="fb-title"><i :data-lucide="isRight ? 'check-circle' : 'x-circle'" style="width:17px;height:17px"></i>
                <span x-text="isRight ? 'Exact !' : 'Pas tout à fait…'"></span></p>
              <p class="fb-expl" x-text="explanation"></p>
            </div>
          </div>
          <div class="quiz-footer">
            <button x-show="!checked" class="ctaBtn cta-verify" :disabled="selected===null || busy" @click="check()" x-cloak x-text="busy ? '…' : 'Vérifier'"></button>
            <button x-show="checked" class="ctaBtn" x-cloak :class="isRight ? 'cta-continue-ok' : 'cta-continue-ko'" @click="go()">Continuer <i data-lucide="arrow-right" style="width:18px;height:18px"></i></button>
          </div>
        </div>
      </template>

      <!-- ───── odd_one_out ───── -->
      <template x-if="q.type === 'odd_one_out'">
        <div x-data="blockOddOneOut(q)" style="flex:1;display:flex;flex-direction:column;min-height:0">
          <div class="quiz-body" :class="checked && !isRight ? 'shake-wrong' : ''">
            <div class="q-scene"><div class="q-scene-row"><h2 class="q-instruction" x-text="frTypo(quiz.instruction)"></h2><button type="button" class="q-audio" x-show="$store.tts.ok" @click="$store.tts.speak(quiz.instruction)" aria-label="Écouter la question">🔊</button></div></div>
            <div class="options">
              <template x-for="(item, i) in quiz.items" :key="i">
                <button class="opt" :class="optClass(i)" @click="!checked && (selected=i)" :disabled="checked || busy">
                  <span class="opt-check">
                    <i data-lucide="check" style="width:14px;height:14px" x-show="selected===i || optClass(i)==='correct'" x-cloak></i>
                    <i data-lucide="x" style="width:14px;height:14px" x-show="optClass(i)==='wrong'" x-cloak></i>
                  </span>
                  <span x-text="item"></span>
                </button>
              </template>
            </div>
            <div x-show="checked" x-cloak class="fb-panel" :class="isRight ? 'fb-ok' : 'fb-ko'">
              <p class="fb-title"><i :data-lucide="isRight ? 'check-circle' : 'x-circle'" style="width:17px;height:17px"></i>
                <span x-text="isRight ? 'Bien vu !' : 'L\'intrus était : ' + quiz.items[solution.odd_index]"></span></p>
              <p class="fb-expl" x-text="explanation"></p>
            </div>
          </div>
          <div class="quiz-footer">
            <button x-show="!checked" class="ctaBtn cta-verify" :disabled="selected===null || busy" @click="check()" x-cloak x-text="busy ? '…' : 'Vérifier'"></button>
            <button x-show="checked" class="ctaBtn" x-cloak :class="isRight ? 'cta-continue-ok' : 'cta-continue-ko'" @click="go()">Continuer <i data-lucide="arrow-right" style="width:18px;height:18px"></i></button>
          </div>
        </div>
      </template>

      <!-- ───── k_prime ───── -->
      <template x-if="q.type === 'k_prime'">
        <div x-data="blockKPrime(q)" style="flex:1;display:flex;flex-direction:column;min-height:0">
          <div class="quiz-body" :class="checked && !isRight ? 'shake-wrong' : ''">
            <div class="q-scene"><div class="q-scene-row"><h2 class="q-instruction" x-text="frTypo(quiz.instruction)"></h2><button type="button" class="q-audio" x-show="$store.tts.ok" @click="$store.tts.speak(quiz.instruction)" aria-label="Écouter la question">🔊</button></div></div>
            <div class="kp-list">
              <template x-for="(st, i) in quiz.statements" :key="i">
                <div class="kp-row">
                  <span class="kp-text" x-text="st.text"></span>
                  <div class="kp-toggles">
                    <button class="kp-btn" :class="btnClass(i, true)"  @click="!checked && set(i, true)"  :disabled="checked || busy">V</button>
                    <button class="kp-btn" :class="btnClass(i, false)" @click="!checked && set(i, false)" :disabled="checked || busy">F</button>
                  </div>
                </div>
              </template>
            </div>
            <div x-show="checked" x-cloak class="fb-panel" :class="isRight ? 'fb-ok' : 'fb-ko'">
              <p class="fb-title"><i :data-lucide="isRight ? 'check-circle' : 'x-circle'" style="width:17px;height:17px"></i>
                <span x-text="isRight ? 'Parfait !' : 'Quelques erreurs…'"></span></p>
              <p class="fb-expl" x-text="explanation"></p>
            </div>
          </div>
          <div class="quiz-footer">
            <button x-show="!checked" class="ctaBtn cta-verify" :disabled="!allAnswered || busy" @click="check()" x-cloak x-text="busy ? '…' : 'Vérifier'"></button>
            <button x-show="checked" class="ctaBtn" x-cloak :class="isRight ? 'cta-continue-ok' : 'cta-continue-ko'" @click="go()">Continuer <i data-lucide="arrow-right" style="width:18px;height:18px"></i></button>
          </div>
        </div>
      </template>

      <!-- ───── cloze_test ───── -->
      <template x-if="q.type === 'cloze_test'">
        <div x-data="blockCloze(q)" style="flex:1;display:flex;flex-direction:column;min-height:0">
          <div class="quiz-body" :class="checked && !isRight ? 'shake-wrong' : ''">
            <div class="q-scene"><div class="q-scene-row"><h2 class="q-instruction" x-text="frTypo(quiz.instruction)"></h2><button type="button" class="q-audio" x-show="$store.tts.ok" @click="$store.tts.speak(quiz.instruction)" aria-label="Écouter la question">🔊</button></div></div>
            <div class="cloze-text">
              <template x-for="(seg, i) in segments" :key="i">
                <span>
                  <span x-show="seg.type==='text'" x-text="seg.value"></span>
                  <template x-if="seg.type==='blank'">
                    <span>
                      <input class="cloze-input" :class="inputClass(seg.idx)" x-model="inputs[seg.idx]" :disabled="checked || busy"
                             :placeholder="'…'" @keydown.enter.prevent="allFilled && !checked && check()">
                      <span class="cloze-sol" x-show="checked && inputClass(seg.idx)==='wrong'" x-cloak x-text="'→ ' + solution.answers[seg.idx]"></span>
                    </span>
                  </template>
                </span>
              </template>
            </div>
            <div x-show="checked" x-cloak class="fb-panel" :class="isRight ? 'fb-ok' : 'fb-ko'">
              <p class="fb-title"><i :data-lucide="isRight ? 'check-circle' : 'x-circle'" style="width:17px;height:17px"></i>
                <span x-text="isRight ? 'Bien joué !' : 'Pas tout à fait…'"></span></p>
              <p class="fb-expl" x-text="explanation"></p>
            </div>
          </div>
          <div class="quiz-footer">
            <button x-show="!checked" class="ctaBtn cta-verify" :disabled="!allFilled || busy" @click="check()" x-cloak x-text="busy ? '…' : 'Vérifier'"></button>
            <button x-show="checked" class="ctaBtn" x-cloak :class="isRight ? 'cta-continue-ok' : 'cta-continue-ko'" @click="go()">Continuer <i data-lucide="arrow-right" style="width:18px;height:18px"></i></button>
          </div>
        </div>
      </template>

      <!-- ───── mcq_multiple ───── -->
      <template x-if="q.type === 'mcq_multiple'">
        <div x-data="blockMcqMultiple(q)" style="flex:1;display:flex;flex-direction:column;min-height:0">
          <div class="quiz-body" :class="checked && !isRight ? 'shake-wrong' : ''">
            <div class="q-scene"><div class="q-scene-row"><h2 class="q-instruction" x-text="frTypo(quiz.instruction)"></h2><button type="button" class="q-audio" x-show="$store.tts.ok" @click="$store.tts.speak(quiz.instruction)" aria-label="Écouter la question">🔊</button></div></div>
            <p style="font-size:12px;color:var(--text-mute);margin:-14px 0 16px;font-weight:600">Coche toutes les bonnes réponses</p>
            <div class="options">
              <template x-for="(opt, i) in quiz.options" :key="i">
                <button class="opt" :class="optClass(i)" @click="toggle(i)" :disabled="checked || busy">
                  <span class="opt-check">
                    <i data-lucide="check" style="width:14px;height:14px" x-show="isSelected(i) || optClass(i)==='correct'" x-cloak></i>
                    <i data-lucide="x" style="width:14px;height:14px" x-show="optClass(i)==='wrong'" x-cloak></i>
                    <i data-lucide="alert-circle" style="width:14px;height:14px" x-show="optClass(i)==='missed'" x-cloak></i>
                  </span>
                  <span x-text="opt"></span>
                  <span class="opt-tag" x-show="checked && optClass(i)==='missed'" x-cloak style="color:#F59E0B">oubliée</span>
                </button>
              </template>
            </div>
            <div x-show="checked" x-cloak class="fb-panel" :class="isRight ? 'fb-ok' : 'fb-ko'">
              <p class="fb-title"><i :data-lucide="isRight ? 'check-circle' : 'x-circle'" style="width:17px;height:17px"></i>
                <span x-text="isRight ? 'Parfait ! Toutes les bonnes cases.' : 'Pas tout à fait…'"></span></p>
              <p class="fb-expl" x-text="explanation"></p>
            </div>
          </div>
          <div class="quiz-footer">
            <button x-show="!checked" class="ctaBtn cta-verify" :disabled="selected.length===0 || busy" @click="check()" x-cloak x-text="busy ? '…' : 'Vérifier'"></button>
            <button x-show="checked" class="ctaBtn" x-cloak :class="isRight ? 'cta-continue-ok' : 'cta-continue-ko'" @click="go()">Continuer <i data-lucide="arrow-right" style="width:18px;height:18px"></i></button>
          </div>
        </div>
      </template>

      <!-- ───── matching ───── -->
      <template x-if="q.type === 'matching'">
        <div x-data="blockMatching(q)" style="flex:1;display:flex;flex-direction:column;min-height:0">
          <div class="quiz-body" :class="checked && !isRight ? 'shake-wrong' : ''">
            <div class="q-scene"><div class="q-scene-row"><h2 class="q-instruction" x-text="frTypo(quiz.instruction)"></h2><button type="button" class="q-audio" x-show="$store.tts.ok" @click="$store.tts.speak(quiz.instruction)" aria-label="Écouter la question">🔊</button></div></div>

            <!-- grille tap-tap (avant vérification) -->
            <div x-show="!checked">
              <div class="match-grid">
                <div class="match-col">
                  <template x-for="(left, i) in lefts" :key="i">
                    <button class="match-card match-card-left"
                      :class="{ 'is-selected': selectedLeft===i && links[i]===null, 'is-linked': links[i]!==null }"
                      :style="links[i]!==null ? `--pair-c:${PAIR_COLORS[i % PAIR_COLORS.length]}` : ''"
                      @click="tapLeft(i)" :disabled="busy">
                      <span style="flex:1" x-text="left"></span>
                      <span x-show="links[i]!==null" class="pair-badge" :style="`--pair-c:${PAIR_COLORS[i % PAIR_COLORS.length]}`" x-text="i+1"></span>
                      <i x-show="selectedLeft===i && links[i]===null" data-lucide="chevron-right" style="width:15px;height:15px;color:var(--accent);flex-shrink:0"></i>
                    </button>
                  </template>
                </div>
                <div class="match-col">
                  <template x-for="(r, j) in rights" :key="r.oi">
                    <button class="match-card match-card-right"
                      :class="{ 'is-linked': reverseLink(j)!==null }"
                      :style="reverseLink(j)!==null ? `--pair-c:${PAIR_COLORS[reverseLink(j) % PAIR_COLORS.length]}` : ''"
                      @click="tapRight(j)" :disabled="busy">
                      <span x-show="reverseLink(j)!==null" class="pair-badge" :style="`--pair-c:${PAIR_COLORS[reverseLink(j) % PAIR_COLORS.length]}`" x-text="reverseLink(j)+1"></span>
                      <span style="flex:1" x-text="r.text"></span>
                    </button>
                  </template>
                </div>
              </div>
              <p class="match-hint" x-show="selectedLeft===null && links.every(v => v===null)">Touche un élément à gauche, puis son correspondant à droite</p>
            </div>

            <!-- résultat (après vérification) -->
            <div x-show="checked" x-cloak>
              <div class="match-grid">
                <div class="match-col">
                  <template x-for="(left, i) in lefts" :key="i">
                    <div class="match-card match-card-left" :class="isLinkedCorrectly(i) ? 'is-correct' : 'is-wrong'">
                      <span style="flex:1" x-text="left"></span>
                      <i :data-lucide="isLinkedCorrectly(i) ? 'check' : 'x'" style="width:14px;height:14px;flex-shrink:0"></i>
                    </div>
                  </template>
                </div>
                <div class="match-col">
                  <template x-for="(left, i) in lefts" :key="i">
                    <div class="match-card match-card-right" :class="isLinkedCorrectly(i) ? 'is-correct' : 'is-wrong'">
                      <span style="flex:1" x-text="links[i]!==null ? rights[links[i]].text : '—'"></span>
                    </div>
                  </template>
                </div>
              </div>
              <template x-if="!isRight && solution.pairs">
                <div class="assoc-list">
                  <div style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--ok);margin:12px 0 6px">Bonnes associations :</div>
                  <template x-for="(pair, i) in solution.pairs" :key="i">
                    <div class="assoc-row">
                      <span class="assoc-left" x-text="pair.left"></span>
                      <span class="assoc-arr">→</span>
                      <span class="assoc-right" x-text="pair.right"></span>
                    </div>
                  </template>
                </div>
              </template>

            </div>
            <div x-show="checked" x-cloak class="fb-panel" :class="isRight ? 'fb-ok' : 'fb-ko'">
              <p class="fb-title"><i :data-lucide="isRight ? 'check-circle' : 'x-circle'" style="width:17px;height:17px"></i><span x-text="isRight ? 'Bravo !' : ('Réponse attendue : ' + (solution.correct_expression || ''))"></span></p>
              <p class="fb-expl" x-text="explanation"></p>
            </div>
          </div>
          <div class="quiz-footer">
            <button x-show="!checked" class="ctaBtn cta-verify" :disabled="busy" @click="check()" x-cloak x-text="busy ? '…' : 'Vérifier'"></button>
            <button x-show="checked" class="ctaBtn" x-cloak :class="isRight ? 'cta-continue-ok' : 'cta-continue-ko'" @click="go()">Continuer <i data-lucide="arrow-right" style="width:18px;height:18px"></i></button>
          </div>

      <!-- ───── fallback minimal (type inconnu — sécurité) ───── -->
      <template x-if="!['mcq_single','true_false','odd_one_out','k_prime','cloze_test','mcq_multiple','matching','chrono_order','parsons_puzzle','number_input','dynamic_formula','spot_the_bug','math_expression'].includes(q.type)">
        <div style="flex:1;display:flex;flex-direction:column;min-height:0">
          {# Pas de :class shake ici : ce bloc n'a pas de blockBase (pas de checked). #}
          <div class="quiz-body">
            <h2 class="q-instruction" x-text="q.instruction"></h2>
            <div class="fallback-card">
              <i data-lucide="construction" style="width:26px;height:26px;color:var(--text-mute)"></i>
              <p style="margin:10px 0 0">Ce type de question (<span x-text="q.type"></span>) n'est pas reconnu.</p>

      </template>

    </div>
  </template>

  <!-- ════════════════ PHASE FINALE ════════════════ -->
  <template x-if="phase === 'done'">
    <div class="final-wrap" x-init="$nextTick(() => { spawnConfetti(); refreshIcons(); })">
      <div class="trophy-ring"><i data-lucide="award" style="width:54px;height:54px;color:#fff"></i></div>
      <div style="display:flex;gap:8px;margin-bottom:16px">
        <template x-for="s in [1,2,3]" :key="s">
          <span class="star-item" :class="s <= stars ? 'lit' : ''" :style="`animation-delay:${s*.12}s`">
            <i data-lucide="star" :style="`width:34px;height:34px;color:${s <= stars ? '#FBBF24' : 'rgba(255,255,255,.15)'};fill:${s <= stars ? '#FBBF24' : 'none'}`"></i>
          </span>
        </template>
      </div>
      <h1 style="font-size:25px;font-weight:800;margin:0 0 6px" x-text="endTitle"></h1>
      <p style="color:var(--text-dim);font-size:14px;margin:0 0 26px" x-text="`${score} / ${questions.length} bonnes réponses`"></p>
      <div style="display:flex;gap:14px;margin-bottom:30px">
        <div class="miniCard"><div style="font-size:26px;font-weight:800;color:var(--accent)" x-text="'+' + xp"></div><div style="font-size:12px;color:var(--text-dim)">XP gagnés</div></div>
        <div class="miniCard"><div style="font-size:26px;font-weight:800;color:var(--ok)" x-text="score"></div><div style="font-size:12px;color:var(--text-dim)">Réussites</div></div>
      </div>

        Retour au parcours <i data-lucide="check" style="width:18px;height:18px"></i>
      </a>
    </div>

  <!-- ════ Modal « quitter ? » — sortie toujours confirmée pendant le quiz ════ -->
  <template x-if="confirmExit && phase === 'quiz'">
    <div class="exit-veil" @click.self="confirmExit = false">
      <div class="exit-card">
        <div class="exit-emoji">🤔</div>
        <p class="exit-title">Quitter le quiz ?</p>
        <p class="exit-msg">Ta progression sur cette série ne sera pas gardée. Tu pourras recommencer depuis le parcours.</p>
        <button type="button" class="exit-stay" @click="confirmExit = false">Continuer le quiz</button>
        <a class="exit-leave" :href="parcoursUrl">Quitter</a>
      </div>

</div><!-- /quizShell -->

<script>
{% verbatim %}
const _RQ = JSON.parse(document.getElementById('rq-data').textContent);

// POST partagé : envoie la réponse, reçoit le verdict SERVEUR.
async function postAnswer(quizId, answer) {
  const res = await fetch(RUNNER_CFG.answerUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': RUNNER_CFG.csrf },
    body: JSON.stringify({ quiz_id: quizId, answer }),
  });
  if (!res.ok) throw new Error('validation failed');
  return res.json();   // { correct, explanation, solution, passes_done, passes }
}

document.addEventListener('alpine:init', () => {

  // ── Shell : séquence + écran final ──
  // Typographie française : espace INSÉCABLE avant : ; ! ? — sinon la ponctuation
  // se retrouve seule en début de ligne (« … plus grand \n : »).
  window.frTypo = (s) => String(s || '').replace(/ ([:;!?»])/g, ' $1').replace(/(«) /g, '$1 ');

  // Lecture audio de la question (TTS navigateur, v1 — MP3 pré-générés en cible).
  // Bouton visible pour TOUS les niveaux : au Mali le français est souvent langue
  // seconde — entendre la question aide du préscolaire au lycée.
  Alpine.store('tts', {
    ok: ('speechSynthesis' in window),
    speak(text) {
      try {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(String(text || ''));
        u.lang = 'fr-FR'; u.rate = 0.95;
        const fr = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('fr'));
        if (fr) u.voice = fr;
        speechSynthesis.speak(u);
        if (window.LearnSFX) LearnSFX.play('tap');
      } catch (e) {}
    },
  });

  Alpine.data('quizShell', () => ({
    idx: 0, results: [], phase: 'quiz', confirmExit: false, streak: 0,
    questions: _RQ,
    parcoursUrl: RUNNER_CFG.parcoursUrl,
    get q()        { return this.questions[this.idx]; },
    get score()    { return this.results.filter(Boolean).length; },
    get stars()    { const r = this.score / this.questions.length; return r >= .85 ? 3 : r >= .6 ? 2 : r > 0 ? 1 : 0; },
    get xp()       { return this.score * 10; },
    get endTitle() { return this.stars === 3 ? 'Parfait !' : this.stars === 2 ? 'Bien joué !' : this.stars === 1 ? 'Courage !' : 'À retravailler'; },
    refreshIcons() { if (window.lucide) lucide.createIcons(); },
    advance(detail) {
      this.results.push(detail.correct);
      // Flamme : chaque bonne réponse la nourrit ; la PREMIÈRE erreur l'éteint.
      this.streak = detail.correct ? this.streak + 1 : 0;
      setTimeout(() => {
        if (this.idx + 1 >= this.questions.length) { this.phase = 'done'; if (window.LearnSFX) LearnSFX.play('win'); }
        else { this.idx++; this.$nextTick(() => this.refreshIcons()); }
      }, 170);
    },
    spawnConfetti() {
      if (this.stars === 0) return;
      const colors = ['#22D3EE','#F59E0B','var(--ok)','var(--ko)','#A78BFA','#FB7185','#FBBF24'];
      for (let k = 0; k < 44; k++) {
        const el = document.createElement('div');
        el.className = 'confetti-piece';
        const sz = 5 + Math.random() * 9;
        el.style.cssText = `left:${Math.random()*100}vw;top:0;width:${sz}px;height:${sz}px;background:${colors[k % colors.length]};--dur:${1.1 + Math.random()*1.3}s;--delay:${Math.random()*.9}s;border-radius:${Math.random() > .45 ? '50%' : '2px'};`;
        document.body.appendChild(el);
        el.addEventListener('animationend', () => el.remove(), { once: true });
      }
    },
  }));

  // ── socle commun des blocs (état serveur) ──
  const blockBase = (quiz) => ({
    quiz, checked: false, busy: false, isRight: false,
    solution: {}, explanation: '',
    async submit(answer) {
      this.busy = true;
      try {
        const r = await postAnswer(this.quiz.id, answer);
        this.isRight = r.correct; this.solution = r.solution || {}; this.explanation = r.explanation || '';
        if (window.LearnSFX) LearnSFX.play(r.correct ? 'correct' : 'wrong');
        try { navigator.vibrate && navigator.vibrate(r.correct ? 18 : [55, 40, 55]); } catch (e) {}
        this.checked = true;
        this.$nextTick(() => { if (window.lucide) lucide.createIcons(); });
      } catch (e) {
        this.busy = false; alert('Connexion interrompue, réessaie.'); return;
      }
      this.busy = false;
    },
    go() { this.$dispatch('quiz:answered', { correct: this.isRight }); },
  });

  // ── mcq_single ──
  Alpine.data('blockMcqSingle', (quiz) => ({
    ...blockBase(quiz), selected: null,
    optClass(i) {
      if (!this.checked) return this.selected === i ? 'selected' : '';
      if (i === this.solution.answer_index) return 'correct';
      if (i === this.selected && !this.isRight) return 'wrong';
      return 'dimmed';
    },
    check() { if (this.selected !== null) this.submit(this.selected); },
  }));

  // ── true_false ──
  Alpine.data('blockTrueFalse', (quiz) => ({
    ...blockBase(quiz), selected: null,
    cardClass(val) {
      if (!this.checked) return this.selected === val ? 'selected' : '';
      if (val === this.solution.answer) return 'correct';
      if (val === this.selected && !this.isRight) return 'wrong';
      return '';
    },
    check() { if (this.selected !== null) this.submit(this.selected); },
  }));

  // ── odd_one_out ──
  Alpine.data('blockOddOneOut', (quiz) => ({
    ...blockBase(quiz), selected: null,
    optClass(i) {
      if (!this.checked) return this.selected === i ? 'selected' : '';
      if (i === this.solution.odd_index) return 'correct';
      if (i === this.selected && !this.isRight) return 'wrong';
      return 'dimmed';
    },
    check() { if (this.selected !== null) this.submit(this.selected); },
  }));

  // ── k_prime ──
  Alpine.data('blockKPrime', (quiz) => ({
    ...blockBase(quiz),
    answers: new Array(quiz.statements.length).fill(null),
    set(i, val) { this.answers[i] = val; },
    get allAnswered() { return this.answers.every(a => a !== null); },
    btnClass(i, val) {
      if (!this.checked) return this.answers[i] === val ? (val ? 'kp-on-v' : 'kp-on-f') : '';
      // après correction : surligne la bonne réponse, marque l'erreur de l'élève
      const sol = this.solution.answers[i];
      if (val === sol) return 'kp-good';
      if (val === this.answers[i] && this.answers[i] !== sol) return 'kp-bad';
      return '';
    },
    check() { if (this.allAnswered) this.submit(this.answers); },
  }));

  // ── cloze_test (NOUVEAU widget) ──
  Alpine.data('blockCloze', (quiz) => ({
    ...blockBase(quiz),
    inputs: [],
    segments: [],
    init() {
      // découpe le texte "… {{0}} … {{1}} …" en segments texte/trou
      const parts = (this.quiz.text || '').split(/(\{\{\d+\}\})/);
      const segs = []; let nBlanks = 0;
      parts.forEach(p => {
        const m = p.match(/^\{\{(\d+)\}\}$/);
        if (m) { const idx = parseInt(m[1], 10); segs.push({ type: 'blank', idx }); nBlanks = Math.max(nBlanks, idx + 1); }
        else if (p) { segs.push({ type: 'text', value: p }); }
      });
      this.segments = segs;
      this.inputs = new Array(nBlanks).fill('');
    },
    get allFilled() { return this.inputs.length > 0 && this.inputs.every(v => v.trim() !== ''); },
    inputClass(idx) {
      if (!this.checked) return '';
      const norm = s => (s || '').trim().toLowerCase();
      return norm(this.inputs[idx]) === norm(this.solution.answers[idx]) ? 'correct' : 'wrong';
    },
    check() { if (this.allFilled) this.submit(this.inputs.map(v => v.trim())); },
  }));

  // ── mcq_multiple (cocher plusieurs) ──
  Alpine.data('blockMcqMultiple', (quiz) => ({
    ...blockBase(quiz), selected: [],
    toggle(i) {
      if (this.checked) return;
      const k = this.selected.indexOf(i);
      if (k === -1) this.selected.push(i); else this.selected.splice(k, 1);
    },
    isSelected(i) { return this.selected.includes(i); },
    optClass(i) {
      if (!this.checked) return this.isSelected(i) ? 'selected' : '';
      const ok = (this.solution.answer_indices || []);
      if (ok.includes(i) && this.isSelected(i)) return 'correct';
      if (ok.includes(i) && !this.isSelected(i)) return 'missed';   // bonne réponse oubliée
      if (!ok.includes(i) && this.isSelected(i)) return 'wrong';    // cochée à tort
      return 'dimmed';
    },
    check() { if (this.selected.length) this.submit([...this.selected]); },
  }));

  // ── matching (liaison tap-tap, right mélangé côté serveur) ──
  // links[i] = index (dans `rights`) choisi pour left[i] ; la réponse soumise =
  // [rights[links[i]].oi …] (index d'origine) — validée par _eval_matching côté serveur.
  Alpine.data('blockMatching', (quiz) => ({
    ...blockBase(quiz),
    lefts: quiz.lefts || [],
    rights: quiz.rights || [],
    selectedLeft: null,
    links: new Array((quiz.lefts || []).length).fill(null),
    PAIR_COLORS: ['#22D3EE','#F59E0B','#A78BFA','#FB7185','#34D399','#FBBF24'],
    reverseLink(j) { const i = this.links.indexOf(j); return i === -1 ? null : i; },
    tapLeft(i) {
      if (this.checked) return;
      if (this.links[i] !== null) { this.links[i] = null; this.selectedLeft = i; return; }
      this.selectedLeft = (this.selectedLeft === i) ? null : i;
    },
    tapRight(j) {
      if (this.checked || this.selectedLeft === null) return;
      const prev = this.reverseLink(j);          // ce right était-il déjà pris ?
      if (prev !== null) this.links[prev] = null;
      this.links[this.selectedLeft] = j;
      this.selectedLeft = null;
    },
    get allLinked() { return this.links.length > 0 && this.links.every(v => v !== null); },
    isLinkedCorrectly(i) { return this.links[i] !== null && this.rights[this.links[i]].oi === i; },
    check() {
      if (!this.allLinked) return;
      this.submit(this.links.map(j => this.rights[j].oi));
    },
  }));

  // ── chrono_order (flèches ▲▼) ──
  // order[rank] = index d'origine de l'item à cette position ; réponse = order.
  Alpine.data('blockChrono', (quiz) => ({
    ...blockBase(quiz),
    order: quiz.items.map((_, i) => i),
    move(rank, dir) {
      const j = rank + dir;
      if (j < 0 || j >= this.order.length) return;
      [this.order[rank], this.order[j]] = [this.order[j], this.order[rank]];
    },
    rowClass(rank) {
      if (!this.checked) return '';
      return this.order[rank] === (this.solution.correct_order || [])[rank] ? 'correct' : 'wrong';
    },
    check() { this.submit([...this.order]); },
  }));

  // ── parsons_puzzle (ordre + indentation) ──
  // rows = [{id, text, indent}] dans l'ordre soumis ; réponse = [{id, indent}].
  Alpine.data('blockParsons', (quiz) => ({
    ...blockBase(quiz),
    rows: (quiz.lines || []).map(l => ({ id: l.id, text: l.text, indent: 0 })),
    move(rank, dir) {
      const j = rank + dir;
      if (j < 0 || j >= this.rows.length) return;
      [this.rows[rank], this.rows[j]] = [this.rows[j], this.rows[rank]];
    },
    indent(rank, dir) {
      const v = this.rows[rank].indent + dir;
      if (v < 0 || v > 6) return;
      this.rows[rank].indent = v;
    },
    rowClass(rank) {
      if (!this.checked || !this.solution.sequence) return '';
      const sol = this.solution.sequence[rank];
      const r = this.rows[rank];
      return (sol && sol.text === r.text && sol.indent === r.indent) ? 'correct' : 'wrong';
    },
    init() { this.$nextTick(() => { if (window.Prism) Prism.highlightAll(); }); },
    check() { this.submit(this.rows.map(r => ({ id: r.id, indent: r.indent }))); },
  }));

  // ── number_input + dynamic_formula (champ numérique) ──
  Alpine.data('blockNumber', (quiz) => ({
    ...blockBase(quiz), val: '',
    check() {
      if (this.val === '') return;
      const n = parseFloat(String(this.val).replace(',', '.'));
      if (Number.isNaN(n)) { this.val = ''; return; }
      this.submit(n);
    },
  }));

  // ── spot_the_bug (ligne cliquable) ──
  Alpine.data('blockSpotBug', (quiz) => ({
    ...blockBase(quiz), selected: null,
    lineClass(i) {
      if (!this.checked) return this.selected === i ? 'ln-sel' : '';
      if (i === this.solution.buggy_line) return 'ln-correct';
      if (i === this.selected && !this.isRight) return 'ln-wrong';
      return '';
    },
    check() { if (this.selected !== null) this.submit(this.selected); },
  }));

  // ── math_expression (MathQuill → format serveur) ──
  // Le pont latexToServer reproduit la forme canonique attendue par _eval_math_expression ;
  // la COMPARAISON finale est 100% serveur (le client n'a jamais la bonne réponse).
  function latexToServer(tex) {
    let s = tex || '';
    s = s.replace(/\\left|\\right/g, '');
    s = s.replace(/\\[,;:! ]/g, '');
    s = s.replace(/\\cdot|\\times/g, '*');
    s = s.replace(/\\pi/g, 'pi');
    const frac = /\\frac\{([^{}]*)\}\{([^{}]*)\}/;
    while (frac.test(s)) s = s.replace(frac, '($1)/($2)');
    const sq = /\\sqrt\{([^{}]*)\}/;
    while (sq.test(s)) s = s.replace(sq, 'sqrt($1)');
    s = s.replace(/\^\{([^{}]*)\}/g, '^$1');
    s = s.replace(/[{}]/g, '');
    s = s.replace(/\\[a-zA-Z]+/g, '');
    s = s.replace(/\\/g, '');
    return s.replace(/\s+/g, '');
  }
  Alpine.data('blockMath', (quiz) => ({
    ...blockBase(quiz), mf: null,
    init() { this.$nextTick(() => this.mountMQ()); },
    mountMQ() {
      if (!window.MathQuill) { return; }
      const MQ = MathQuill.getInterface(2);
      this.mf = MQ.MathField(this.$refs.mq, {
        spaceBehavesLikeTab: true,
        handlers: { enter: () => { if (!this.checked) this.check(); } },
      });
      this.mf.focus();
    },
    key(a) {
      const mf = this.mf; if (!mf) return;
      switch (a) {
        case 'sq2':  mf.write('^2'); break;
        case 'sqrt': mf.cmd('\\sqrt'); break;
        case 'frac': mf.cmd('\\frac'); break;
        case 'pi':   mf.cmd('\\pi'); break;
        case 'cdot': mf.cmd('\\cdot'); break;
        case 'bksp': mf.keystroke('Backspace'); break;
        default:     mf.typedText(a);
      }
      mf.focus();
    },
    check() {
      if (this.checked || !this.mf) return;
      const out = latexToServer(this.mf.latex());
      if (!out) return;
      this.submit(out);   // string → validation serveur (_eval_math_expression)
    },
  }));

});
{% endverbatim %}
</script>

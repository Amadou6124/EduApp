{% load static %}<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choisir votre mot de passe — EduApp</title>
  <link rel="stylesheet" href="{% static 'vendor/fonts/manrope/manrope.css' %}">
  <link rel="stylesheet" href="{% static 'css/output.css' %}">
  <script defer src="{% static 'vendor/alpine/alpine.min.js' %}"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-100 via-white to-blue-50 flex items-center justify-center p-4">

<div x-data="{ showPwd: false }" class="w-full max-w-md">

  <div class="text-center mb-6">
    <div class="w-14 h-14 bg-primary-600 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg shadow-blue-900/20">
      <i data-lucide="key-round" class="w-7 h-7 text-white"></i>
    </div>
    <h1 class="text-xl font-bold text-gray-900">Bienvenue {{ request.user.full_name }}</h1>
    <p class="text-gray-500 text-sm mt-1 leading-relaxed">
      Pour votre sécurité, choisissez <strong>votre propre</strong> mot de passe.<br>
      Celui que l'école vous a remis ne servira plus.
    </p>
  </div>

  <form method="post" action="{% url 'accounts:password-set' %}"
        class="bg-white rounded-2xl shadow-xl border border-gray-100 p-6 space-y-4">
    {% csrf_token %}

    {% if error %}
      <div class="px-4 py-3 rounded-xl border bg-red-50 border-red-200 text-red-700 text-sm font-medium">
        {{ error }}
      </div>
    {% endif %}

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1.5">Nouveau mot de passe</label>
      <div class="relative">
        <input :type="showPwd ? 'text' : 'password'" name="password" required autofocus
               class="input-field pr-10" placeholder="Au moins 4 caractères">
        <button type="button" @click="showPwd = !showPwd" tabindex="-1"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
          <i x-show="!showPwd" data-lucide="eye" class="w-4 h-4"></i>
          <i x-show="showPwd" x-cloak data-lucide="eye-off" class="w-4 h-4"></i>
        </button>
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1.5">Confirmez le mot de passe</label>
      <input :type="showPwd ? 'text' : 'password'" name="confirm" required
             class="input-field" placeholder="Retapez le même">
    </div>

    <button type="submit" class="btn-primary w-full justify-center min-h-[46px]">
      Enregistrer et continuer
    </button>
  </form>

  <p class="text-center mt-5">
    <a href="{% url 'accounts:logout' %}" class="text-sm text-gray-400 hover:text-gray-600">Se déconnecter</a>
  </p>
</div>

<script src="{% static 'vendor/lucide/lucide.min.js' %}"></script>
<script>lucide.createIcons();</script>
</body>
</html>

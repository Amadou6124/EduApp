{% load i18n %}
<div class="bg-white rounded-xl border border-gray-200 p-4">
  <p class="text-xs text-gray-500 uppercase tracking-wide leading-tight">{% trans "Classes actives" %}</p>
  <p class="text-3xl font-bold text-brand-blue mt-1">{{ classes|length }}</p>
</div>
<div class="bg-white rounded-xl border border-gray-200 p-4">
  <p class="text-xs text-gray-500 uppercase tracking-wide leading-tight">{% trans "Élèves inscrits" %}</p>
  <p class="text-3xl font-bold text-brand-blue mt-1">{{ total_students }}</p>
</div>
<div class="bg-white rounded-xl border border-gray-200 p-4">
  <p class="text-xs text-gray-500 uppercase tracking-wide leading-tight">{% trans "Taux remplissage" %}</p>
  <p class="text-3xl font-bold mt-1
            {% if avg_fill_rate >= 90 %}text-red-600
            {% elif avg_fill_rate >= 70 %}text-orange-500
            {% else %}text-green-600{% endif %}">
    {{ avg_fill_rate }}%
  </p>
</div>

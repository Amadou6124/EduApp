{% load i18n humanize %}
<tr id="class-row-{{ school_class.id }}"
    class="hover:bg-gray-50 transition {% if success %}bg-green-50{% endif %}">
  <td class="px-6 py-4 font-semibold text-brand-blue">{{ school_class.name }}</td>
  <td class="px-6 py-4">
    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium
                 {% if school_class.level == 'primary' %}bg-blue-100 text-blue-800
                 {% elif school_class.level == 'middle' %}bg-purple-100 text-purple-800
                 {% elif school_class.level == 'high' %}bg-orange-100 text-orange-800
                 {% else %}bg-gray-100 text-gray-800{% endif %}">
      {{ school_class.get_level_display }}
    </span>
  </td>
  <td class="px-6 py-4 text-right font-mono">{{ school_class.annual_fee|intcomma }}</td>
  <td class="px-6 py-4 text-center">
    <span class="font-semibold {% if school_class.is_full %}text-red-600{% else %}text-gray-700{% endif %}">
      {{ school_class.get_student_count }}
    </span>
  </td>
  <td class="px-6 py-4 text-center text-gray-500">
    {% if school_class.max_capacity %}
      {{ school_class.max_capacity }}
    {% else %}
      <span class="text-gray-300">—</span>
    {% endif %}
  </td>
  <td class="px-6 py-4 text-right">
    <div class="flex items-center justify-end gap-2">
      <!-- Bouton édition inline (HTMX) -->
      <button hx-get="{% url 'schools:class-edit-form' school_class.id %}"
              hx-target="#class-row-{{ school_class.id }}"
              hx-swap="outerHTML"
              class="p-2 text-gray-400 hover:text-brand-blue hover:bg-blue-50 rounded-lg transition"
              title="{% trans "Modifier" %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
        </svg>
      </button>
      <!-- Bouton suppression (HTMX DELETE) -->
      <button hx-delete="{% url 'schools:class-delete' school_class.id %}"
              hx-target="#class-row-{{ school_class.id }}"
              hx-swap="outerHTML"
              hx-confirm="{% trans "Supprimer cette classe ?" %}"
              class="p-2 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition"
              title="{% trans "Supprimer" %}">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
        </svg>
      </button>
    </div>
  </td>
</tr>

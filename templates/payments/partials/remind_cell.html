{# Cellule relance d'une ligne en retard. `r` = ligne overdue (avec .student, .reminded_today). #}
{% if r.reminded_today %}
  <span class="inline-flex items-center gap-1.5 text-xs text-gray-400"><i data-lucide="check" class="w-3.5 h-3.5 text-green-500"></i> Relancé · auj.</span>
{% else %}
  <button type="button"
          hx-post="{% url 'payments:remind' r.student.id %}"
          hx-target="this" hx-swap="outerHTML" hx-sync="this:drop"
          class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-gray-200 text-gray-600 hover:border-primary-300 hover:text-primary-600 text-xs font-semibold transition">
    <i data-lucide="send" class="w-3.5 h-3.5"></i> Relancer
  </button>
{% endif %}
